<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;700&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.15); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; overflow-x: hidden; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        .logo { width: 120px; height: auto; margin-bottom: 15px; border: 1.5px solid var(--gold); padding: 8px; border-radius: 8px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 2rem; margin: 15px 0; text-transform: uppercase; letter-spacing: 2px; }
        
        .intro-text { width: 90%; max-width: 450px; margin: 20px 0; padding: 15px; border-left: 2px solid var(--gold); background: rgba(197,160,89,0.05); font-size: 0.95rem; color: #ddd; line-height: 1.5; text-align: left; }
        .intro-text b { color: var(--gold); }

        .btn-google { background: white; color: #000; border: none; padding: 20px; border-radius: 10px; font-weight: 700; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; gap: 15px; margin-top: 20px; width: 95%; max-width: 500px; justify-content: center; }
        
        /* STYLE BOUTONS HOME AVEC SVG */
        .btn-gold { background: rgba(197,160,89,0.05); border: 2px solid var(--gold); color: var(--gold); padding: 15px; width: 95%; max-width: 500px; margin: 10px 0; text-transform: uppercase; cursor: pointer; font-weight: 700; font-size: 1.1rem; border-radius: 10px; display: flex; align-items: center; justify-content: start; box-sizing: border-box; transition: background 0.3s; }
        .btn-gold:active { background: rgba(197,160,89,0.15); }
        .btn-gold svg { height: 40px; width: auto; margin-right: 25px; margin-left: 10px; }

        .card { background: #0d0d0d; border: 1px solid var(--brd); padding: 15px; display: flex; width: 98%; max-width: 600px; text-align: left; margin-bottom: 12px; border-radius: 12px; align-items: center; position: relative; box-sizing: border-box; }
        .img-vin { width: 70px; height: 100px; object-fit: cover; background: #1a1a1a; margin-right: 15px; border-radius: 6px; border: 1.5px solid var(--gold); cursor: zoom-in; }
        .vin-info { flex: 1; cursor: pointer; }
        .vin-info b { font-size: 1.3rem; display: block; margin-bottom: 5px; color: var(--gold); line-height: 1.2; }
        .vin-qte { font-size: 1.5rem; font-weight: 700; color: #fff; padding-right: 5px; }
        
        .btn-note { font-size: 1.8rem; background: none; border: none; cursor: pointer; margin-right: 10px; z-index: 10; padding: 10px; }
        .btn-add { position: fixed; bottom: 30px; right: 20px; background: var(--gold); width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 40px; color: #000; box-shadow: 0 4px 20px rgba(197,160,89,0.5); z-index: 100; font-weight: bold; cursor: pointer; }
        
        .stars { font-size: 40px; color: #333; margin: 20px 0; cursor: pointer; }
        .stars .selected { color: var(--gold); }
        
        input, textarea { width: 95%; max-width: 500px; padding: 15px; margin: 8px 0; background: #111; color: #fff; border: 1.5px solid var(--brd); border-radius: 10px; font-size: 1.1rem; box-sizing: border-box; font-family: 'Montserrat'; }
        textarea { min-height: 200px; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        .note-box { background: #111; border: 2px solid var(--gold); padding: 25px; width: 85%; max-width: 500px; border-radius: 15px; color: #fff; text-align: left; max-height: 80vh; overflow-y: auto; }
        #noteText { font-size: 1.1rem; line-height: 1.6; white-space: pre-wrap; margin-bottom: 20px; color: #eee; }
        
        .btn-qr { background: none; border: 1px solid gray; color: gray; padding: 8px; border-radius: 5px; margin-top: 15px; cursor: pointer; font-size: 0.8rem; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="zoomOverlay" class="overlay" onclick="this.style.display='none'"><img id="zoomImg" style="max-width:90%; border-radius:10px; border:2px solid var(--gold)"></div>
    
    <div id="noteOverlay" class="overlay" onclick="this.style.display='none'">
        <div class="note-box" onclick="event.stopPropagation()">
            <h2 style="color:var(--gold); margin-top:0; border-bottom:1px solid var(--brd); padding-bottom:10px;">Dégustation</h2>
            <div id="noteText"></div>
            <button onclick="document.getElementById('noteOverlay').style.display='none'" style="width:100%; background:var(--gold); border:none; padding:15px; border-radius:10px; font-weight:bold; cursor:pointer;">FERMER</button>
        </div>
    </div>

    <div id="qrOverlay" class="overlay" onclick="this.style.display='none'">
        <div class="note-box" style="text-align:center;">
            <h2 style="color:var(--gold);">Partager le carnet</h2>
            <div id="qrContainer" style="background:white; padding:10px; display:inline-block; border-radius:10px; margin:15px 0;"></div>
            <p style="color:gray;">Scanne ce code pour ouvrir l'appli</p>
        </div>
    </div>

    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Le Carnet de la Grappe</h1>
        <div class="intro-text">
            <b>Votre cave, toujours dans votre poche.</b><br>
            Cet assistant numérique vous permet d'<b>inventorier</b> vos précieux crus, de suivre vos <b>stocks</b> et de consigner vos <b>notes de dégustation</b>.
        </div>
        <button class="btn-google" id="googleLogin"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="25"> CONNEXION GOOGLE</button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        
        <!-- BOUTON ROUGES AVEC SVG -->
        <button class="btn-gold" onclick="openRayon('ROUGES')">
            <svg viewBox="0 0 30 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 2C13.5 2 12.5 3 12.5 4.5V15H17.5V4.5C17.5 3 16.5 2 15 2Z" fill="#2A0000"/>
                <path d="M12.5 15C8 17 5 21 5 26V80C5 84.4 8.6 88 13 88H17C21.4 88 25 84.4 25 80V26C25 21 22 17 17.5 15H12.5Z" fill="#5E0000" stroke="#8B0000" stroke-width="1.5"/>
                <path d="M9 35H21V55H9V35Z" fill="#2A0000" opacity="0.8"/>
                <path d="M8 26C8 23.8 9.8 22 12 22H18C20.2 22 22 23.8 22 26V28H8V26Z" fill="#8B0000"/>
                <path d="M16 18V78C16 78 22 75 22 65V35C22 25 16 18 16 18Z" fill="white" opacity="0.1"/>
            </svg>
            VINS ROUGES
        </button>

        <!-- BOUTON BLANCS AVEC SVG -->
        <button class="btn-gold" onclick="openRayon('BLANCS')">
            <svg viewBox="0 0 30 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 2C13.5 2 12.5 3 12.5 4.5V15H17.5V4.5C17.5 3 16.5 2 15 2Z" fill="#444"/>
                <path d="M12.5 15C8 17 5 21 5 26V80C5 84.4 8.6 88 13 88H17C21.4 88 25 84.4 25 80V26C25 21 22 17 17.5 15H12.5Z" fill="#FFFBEB" stroke="#E6C96C" stroke-width="1.5"/>
                <path d="M9 35H21V55H9V35Z" fill="#E6C96C" opacity="0.3"/>
                <path d="M8 26C8 23.8 9.8 22 12 22H18C20.2 22 22 23.8 22 26V28H8V26Z" fill="#C5A059"/>
                <path d="M16 18V78C16 78 22 75 22 65V35C22 25 16 18 16 18Z" fill="white" opacity="0.5"/>
            </svg>
            VINS BLANCS
        </button>

        <!-- BOUTON ROSÉS AVEC SVG -->
        <button class="btn-gold" onclick="openRayon('ROSES')">
            <svg viewBox="0 0 30 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 2C13.5 2 12.5 3 12.5 4.5V15H17.5V4.5C17.5 3 16.5 2 15 2Z" fill="#333"/>
                <path d="M12.5 15C8 17 5 21 5 26V80C5 84.4 8.6 88 13 88H17C21.4 88 25 84.4 25 80V26C25 21 22 17 17.5 15H12.5Z" fill="#FFE4E1" stroke="#FFA07A" stroke-width="1.5"/>
                <path d="M9 35H21V55H9V35Z" fill="#FFA07A" opacity="0.3"/>
                <path d="M8 26C8 23.8 9.8 22 12 22H18C20.2 22 22 23.8 22 26V28H8V26Z" fill="#FA8072"/>
                <path d="M16 18V78C16 78 22 75 22 65V35C22 25 16 18 16 18Z" fill="white" opacity="0.4"/>
            </svg>
            VINS ROSÉS
        </button>

        <!-- BOUTON CHAMPAGNES AVEC SVG -->
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">
            <svg viewBox="0 0 30 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 2C13.5 2 12.5 3 12.5 6V15H17.5V6C17.5 3 16.5 2 15 2Z" fill="#C5A059" stroke="#8A6E3C"/>
                <path d="M12.5 15C9 17 6 21 6 27V80C6 84.4 9.6 88 14 88H16C20.4 88 24 84.4 24 80V27C24 21 21 17 17.5 15H12.5Z" fill="#1A1A1A" stroke="#C5A059" stroke-width="1.5"/>
                <path d="M9 38H21V58H9V38Z" fill="#C5A059" opacity="0.9"/>
                <path d="M8 27C8 24.8 9.8 23 12 23H18C20.2 23 22 24.8 22 27V29H8V27Z" fill="#C5A059" opacity="0.5"/>
                <path d="M15 15V88" stroke="#C5A059" stroke-width="0.5" opacity="0.2"/>
            </svg>
            CHAMPAGNES
        </button>

        <button class="btn-qr" onclick="showQR()">🔗 MON QR CODE</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="color:gray; background:none; border:none; margin-top:30px; text-decoration:underline;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle"></h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="goToAdd()">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:30px; font-weight:700;">← RETOUR</button>
    </div>

    <div id="PAGE_ADD" class="p">
        <h1 id="addTitle">Nouveau Vin</h1>
        <input type="text" id="nomVin" placeholder="Nom du vin">
        <input type="number" id="qteVin" placeholder="Quantité" value="1">
        <button class="btn-gold" onclick="document.getElementById('fileInput').click()" style="border-style:dashed; justify-content:center;">📷 PHOTO / GALERIE</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)">
        <div id="previewContainer"></div>
        <input type="hidden" id="imgData">
        <div class="stars" id="starRating">
            <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
        </div>
        <textarea id="noteVin" rows="10" placeholder="Notes de dégustation..."></textarea>
        <button id="btnSave" class="btn-gold" style="background:var(--gold); color:#000; justify-content:center;" onclick="sauvegarderVin()">ENREGISTRER</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none; margin-top:15px;">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyABRweq9NpgFHy9tWpN8UhD0nBdTmZ-7dU",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID = null, rayonActuel = "", noteEtoiles = 0, editID = null;

        document.getElementById('googleLogin').onclick = () => {
            const p = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(p).catch(() => auth.signInWithRedirect(p));
        };

        auth.onAuthStateChanged(u => {
            if(u) { userUID = u.uid; document.getElementById('userName').innerText = "Cave de " + u.displayName.split(' ')[0]; showPage('PAGE_HOME'); } 
            else { showPage('PAGE_AUTH'); }
        });

        function showPage(id) { document.querySelectorAll('.p').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
        function setStars(n) { noteEtoiles = n; document.querySelectorAll('#starRating span').forEach((s, i) => s.classList.toggle('selected', i < n)); }
        function openRayon(n) { rayonActuel = n; document.getElementById('rayonTitle').innerText = n; chargerVins(); showPage('PAGE_LISTE'); }

        function showQR() {
            document.getElementById('qrContainer').innerHTML = `<img src="mon-qrcode.png" style="width:200px; height:200px; object-fit:contain;">`;
            document.getElementById('qrOverlay').style.display = 'flex';
        }

        function chargerVins() {
            const c = document.getElementById('container-vins');
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => {
                c.innerHTML = "";
                if(!s.exists()) { c.innerHTML = "<p style='color:gray;'>Rayon vide.</p>"; return; }
                s.forEach(child => {
                    const v = child.val(), id = child.key;
                    let st = "★".repeat(v.noteEtoiles || 0) + "☆".repeat(5 - (v.noteEtoiles || 0));
                    c.innerHTML += `
                        <div class="card">
                            <img src="${v.image || 'https://via.placeholder.com/150'}" class="img-vin" onclick="zoom('${v.image}')">
                            <div class="vin-info" onclick="editVin('${id}', ${JSON.stringify(v).replace(/"/g, '&quot;')})">
                                <b>${v.nom}</b>
                                <span style="color:var(--gold);">${st}</span>
                            </div>
                            <button class="btn-note" onclick="event.stopPropagation(); voirNote(\`${v.note ? v.note.replace(/`/g, '\\`').replace(/\n/g, '\\n') : 'Aucune note.'}\`)">📝</button>
                            <div class="vin-qte">x${v.qte}</div>
                            <button style="background:none; border:none; color:#ff4444; font-size:1.5rem;" onclick="event.stopPropagation(); supprimer('${id}')">✕</button>
                        </div>`;
                });
            });
        }

        function voirNote(txt) {
            document.getElementById('noteText').innerText = txt;
            document.getElementById('noteOverlay').style.display = 'flex';
        }

        function handleFile(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('imgData').value = e.target.result;
                document.getElementById('previewContainer').innerHTML = `<img src="${e.target.result}" style="width:80px; margin:10px; border-radius:5px; border:1px solid var(--gold)">`;
            };
            reader.readAsDataURL(input.files[0]);
        }

        function editVin(id, data) {
            editID = id;
            document.getElementById('addTitle').innerText = "Modifier";
            document.getElementById('nomVin').value = data.nom;
            document.getElementById('qteVin').value = data.qte;
            document.getElementById('imgData').value = data.image || "";
            document.getElementById('noteVin').value = data.note || "";
            if(data.image) document.getElementById('previewContainer').innerHTML = `<img src="${data.image}" style="width:80px; margin:10px; border-radius:5px; border:1px solid var(--gold)">`;
            setStars(data.noteEtoiles || 0);
            showPage('PAGE_ADD');
        }

        function zoom(src) { if(!src) return; document.getElementById('zoomImg').src = src; document.getElementById('zoomOverlay').style.display = 'flex'; }
        function supprimer(id) { if(confirm("Supprimer ?")) db.ref('users/' + userUID + '/cave/' + id).remove(); }
        function goToAdd() { editID = null; document.getElementById('addTitle').innerText = "Nouveau Vin"; document.getElementById('nomVin').value=""; document.getElementById('imgData').value=""; document.getElementById('noteVin').value=""; document.getElementById('previewContainer').innerHTML=""; setStars(0); showPage('PAGE_ADD'); }

        function sauvegarderVin() {
            const n = document.getElementById('nomVin').value;
            if(!n) return;
            const data = {
                nom: n, qte: document.getElementById('qteVin').value || 1,
                image: document.getElementById('imgData').value || "",
                noteEtoiles: noteEtoiles, note: document.getElementById('noteVin').value,
                categorie: rayonActuel
            };
            if(editID) db.ref('users/' + userUID + '/cave/' + editID).update(data).then(() => showPage('PAGE_LISTE'));
            else db.ref('users/' + userUID + '/cave').push(data).then(() => showPage('PAGE_LISTE'));
        }
    </script>
</body>
</html>
