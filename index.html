<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;700&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(197, 160, 89, 0.3); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; }
        .active { display: flex !important; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 1.6rem; text-transform: uppercase; margin: 25px 0; }
        .btn-rayon { background: rgba(255,255,255,0.05); border: 1px solid var(--brd); color: var(--gold); padding: 10px 20px; width: 92%; max-width: 480px; margin: 10px 0; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; min-height: 80px; }
        .bottle-img { height: 60px; width: 120px; object-fit: contain; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #111; padding: 20px; border-radius: 15px; border: 1px solid var(--gold); width: 85%; max-width: 300px; }
        .btn-action { background: var(--gold); color: #000; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .card { background: #0d0d0d; border: 1px solid rgba(255,255,255,0.1); padding: 15px; width: 98%; max-width: 500px; margin-bottom: 12px; border-radius: 12px; display: flex; align-items: center; }
        .img-vin { width: 65px; height: 95px; object-fit: cover; border-radius: 6px; border: 1px solid var(--gold); margin-right: 15px; }
        input, textarea { width: 100%; padding: 16px; margin: 10px 0; background: #111; color: #fff; border: 1px solid #333; border-radius: 12px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="qrModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="color:var(--gold)">MON QR CODE</h2>
            <img id="qrImg" src="" style="background:white; padding:10px; border-radius:8px; width:200px;">
            <button onclick="document.getElementById('qrModal').style.display='none'" class="btn-action">FERMER</button>
        </div>
    </div>

    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" style="width:140px; border-radius:12px; border:1px solid var(--gold);">
        <h1>Le Carnet de la Grappe</h1>
        <div style="border:1px solid var(--brd); padding:20px; border-radius:15px; margin:20px; font-size:0.9rem;">
            <b>Votre cave, toujours dans votre poche</b><br>
            Inventorier vos crus, gérez vos stocks et conservez vos notes précieuses.
        </div>
        <button id="googleLogin" class="btn-action" style="background:white">CONNEXION GOOGLE</button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1 id="userName">MA CAVE</h1>
        <button class="btn-rayon" onclick="openRayon('ROUGES')">VINS ROUGES<img src="https://i.servimg.com/u/f49/11/31/89/70/rouge10.png" class="bottle-img"></button>
        <button class="btn-rayon" onclick="openRayon('BLANCS')">VINS BLANCS<img src="https://i.servimg.com/u/f49/11/31/89/70/blanc10.png" class="bottle-img"></button>
        <button class="btn-rayon" onclick="openRayon('ROSES')">VINS ROSÉS<img src="https://i.servimg.com/u/f49/11/31/89/70/rose10.png" class="bottle-img"></button>
        <button class="btn-rayon" onclick="openRayon('CHAMPAGNES')">CHAMPAGNES<img src="https://i.servimg.com/u/f49/11/31/89/70/champa10.png" class="bottle-img"></button>
        <button onclick="genererQR()" style="background:none; border:1px solid #555; color:#aaa; padding:10px 20px; border-radius:10px; margin-top:20px;">🔗 MON QR CODE</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle"></h1>
        <div id="container-vins" style="width:100%; max-width:500px;"></div>
        <button onclick="goToAdd()" style="background:var(--gold); width:60px; height:60px; border-radius:50%; border:none; margin-top:20px; font-size:30px;">+</button>
    </div>

    <div id="PAGE_ADD" class="p">
        <h1>AJOUTER</h1>
        <input type="text" id="nomVin" placeholder="Nom">
        <input type="number" id="qteVin" placeholder="Qté">
        <button class="btn-action" onclick="document.getElementById('fileInput').click()">📷 PHOTO</button>
        <input type="file" id="fileInput" style="display:none" onchange="handleFile(this)">
        <textarea id="noteVin" placeholder="Notes..."></textarea>
        <button class="btn-action" onclick="sauvegarderVin()">ENREGISTRER</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyABRweq9NpgFHy9tWpN8UhD0nBdTmZ-7dU", authDomain: "le-carnet-de-la-grappe.firebaseapp.com", databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app", projectId: "le-carnet-de-la-grappe", appId: "1:90122533942:web:0448a69951e95108ce6c97" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID, rayonActuel, currentImg;

        auth.onAuthStateChanged(u => { if(u){ userUID = u.uid; document.getElementById('userName').innerText = "CAVE DE " + u.displayName.toUpperCase(); showPage('PAGE_HOME'); } else showPage('PAGE_AUTH'); });
        document.getElementById('googleLogin').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());

        function showPage(id) { document.querySelectorAll('.p').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function openRayon(n) { rayonActuel = n; document.getElementById('rayonTitle').innerText = n; chargerVins(); showPage('PAGE_LISTE'); }
        function chargerVins() { db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => { const c = document.getElementById('container-vins'); c.innerHTML = ""; s.forEach(child => { const v = child.val(); c.innerHTML += `<div class="card"><img src="${v.image}" class="img-vin"><b>${v.nom}</b></div>`; }); }); }
        function handleFile(i) { const r = new FileReader(); r.onload = (e) => { currentImg = e.target.result; }; r.readAsDataURL(i.files[0]); }
        function sauvegarderVin() { db.ref('users/' + userUID + '/cave').push({nom:document.getElementById('nomVin').value, qte:document.getElementById('qteVin').value, note:document.getElementById('noteVin').value, image:currentImg, categorie:rayonActuel}).then(() => showPage('PAGE_HOME')); }
        function genererQR() { document.getElementById('qrImg').src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(window.location.href); document.getElementById('qrModal').style.display = 'flex'; }
        function goToAdd() { showPage('PAGE_ADD'); }
    </script>
</body>
</html>
