<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    
    <!-- CONFIGURATION PWA (INSTALLATION) -->
    <meta name="theme-color" content="#c5a059">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Manifest Inline pour forcer la détection -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Le Carnet de la Grappe","short_name":"Grappe","start_url":"index.html","display":"standalone","background_color":"#000000","theme_color":"#c5a059","icons":[{"src":"https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg","sizes":"512x512","type":"image/jpeg","purpose":"any maskable"}]}'>

    <!-- SCRIPTS FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;700&display=swap');
        
        :root {
            --gold: #c5a059;
            --bg: #000;
            --brd: rgba(255,255,255,0.15);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        /* Pages */
        .p { display: none; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }

        /* Éléments */
        .logo { width: 120px; height: auto; margin-bottom: 15px; border: 1.5px solid var(--gold); padding: 8px; border-radius: 8px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 2.2rem; margin: 15px 0; text-transform: uppercase; letter-spacing: 2px; }
        
        .intro-text { 
            width: 90%; 
            max-width: 450px; 
            margin: 20px 0; 
            padding: 15px; 
            border-left: 2px solid var(--gold); 
            background: rgba(197,160,89,0.05); 
            font-size: 0.95rem; 
            color: #ddd; 
            line-height: 1.5;
            text-align: left;
        }

        .btn-google { background: white; color: #000; border: none; padding: 18px; border-radius: 10px; font-weight: 700; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; gap: 15px; margin-top: 20px; width: 95%; max-width: 400px; justify-content: center; }
        .btn-gold { background: rgba(197,160,89,0.05); border: 2px solid var(--gold); color: var(--gold); padding: 18px; width: 95%; max-width: 400px; margin: 10px 0; text-transform: uppercase; cursor: pointer; font-weight: 700; font-size: 1.1rem; border-radius: 10px; }
        
        .card { background: #0d0d0d; border: 1px solid var(--brd); padding: 15px; display: flex; width: 98%; max-width: 600px; text-align: left; margin-bottom: 12px; border-radius: 12px; align-items: center; position: relative; box-sizing: border-box; }
        .img-vin { width: 70px; height: 100px; object-fit: cover; background: #1a1a1a; margin-right: 15px; border-radius: 6px; border: 1.5px solid var(--gold); }
        
        .vin-info { flex: 1; }
        .vin-info b { font-size: 1.3rem; display: block; margin-bottom: 5px; color: var(--gold); }
        .vin-qte { font-size: 1.5rem; font-weight: 700; color: #fff; padding-right: 10px; }

        .btn-add { position: fixed; bottom: 30px; right: 20px; background: var(--gold); width: 65px; height: 65px; border-radius: 50%; border: none; font-size: 35px; color: #000; box-shadow: 0 4px 15px rgba(197,160,89,0.4); z-index: 100; cursor: pointer; }

        input, textarea { width: 95%; max-width: 400px; padding: 15px; margin: 8px 0; background: #111; color: #fff; border: 1.5px solid var(--brd); border-radius: 10px; font-size: 1.1rem; box-sizing: border-box; }
        
        .stars { font-size: 35px; color: #333; margin: 15px 0; }
        .stars .selected { color: var(--gold); }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

    <!-- SERVICE WORKER (VERSION ANGLAISE) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swCode = `
            const CACHE = 'grappe-v1';
            self.addEventListener('install', (e) => e.waitUntil(caches.open(CACHE)));
            self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
          `;
          const blob = new Blob([swCode], {type: 'text/javascript'});
          navigator.serviceWorker.register(URL.createObjectURL(blob));
        });
      }
    </script>

    <!-- PAGE AUTH -->
    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Le Carnet de la Grappe</h1>
        <div class="intro-text">Gérez votre cave et vos dégustations en un clin d'œil.</div>
        <button class="btn-google" id="googleLogin">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> CONNEXION GOOGLE
        </button>
    </div>

    <!-- PAGE HOME -->
    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        <button class="btn-gold" onclick="openRayon('ROUGES')">🍷 ROUGES</button>
        <button class="btn-gold" onclick="openRayon('BLANCS')">🥂 BLANCS</button>
        <button class="btn-gold" onclick="openRayon('ROSES')">🌸 ROSÉS</button>
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">🍾 CHAMPAGNES</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="color:gray; background:none; border:none; margin-top:40px;">Déconnexion</button>
    </div>

    <!-- PAGE LISTE -->
    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle"></h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="goToAdd()">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:20px;">← RETOUR</button>
    </div>

    <!-- PAGE AJOUT -->
    <div id="PAGE_ADD" class="p">
        <h1 id="addTitle">Ajouter</h1>
        <input type="text" id="nomVin" placeholder="Nom du vin">
        <input type="number" id="qteVin" placeholder="Quantité" value="1">
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)">
        <button class="btn-gold" onclick="document.getElementById('fileInput').click()">📷 AJOUTER UNE PHOTO</button>
        <div id="previewContainer"></div>
        <input type="hidden" id="imgData">
        <div class="stars" id="starRating">
            <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
        </div>
        <textarea id="noteVin" rows="4" placeholder="Vos notes de dégustation..."></textarea>
        <button class="btn-gold" style="background:var(--gold); color:#000;" onclick="sauvegarderVin()">ENREGISTRER</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none; margin-top:10px;">Annuler</button>
    </div>

    <script>
        // CONFIGURATION FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID = null, rayonActuel = "", noteEtoiles = 0, editID = null;

        // AUTHENTIFICATION
        document.getElementById('googleLogin').onclick = () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(() => auth.signInWithRedirect(provider));
        };

        auth.onAuthStateChanged(user => {
            if(user) { 
                userUID = user.uid; 
                document.getElementById('userName').innerText = "Cave de " + user.displayName.split(' ')[0];
                showPage('PAGE_HOME'); 
            } else { 
                showPage('PAGE_AUTH'); 
            }
        });

        // NAVIGATION
        function showPage(id) { 
            document.querySelectorAll('.p').forEach(p => p.classList.remove('active')); 
            document.getElementById(id).classList.add('active'); 
            window.scrollTo(0,0);
        }

        function openRayon(n) { 
            rayonActuel = n; 
            document.getElementById('rayonTitle').innerText = n; 
            chargerVins(); 
            showPage('PAGE_LISTE'); 
        }

        // LOGIQUE CAVE
        function chargerVins() {
            const container = document.getElementById('container-vins');
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', snap => {
                container.innerHTML = "";
                if(!snap.exists()) { container.innerHTML = "<p style='color:gray;'>Aucun vin dans ce rayon.</p>"; return; }
                snap.forEach(child => {
                    const v = child.val();
                    const stars = "★".repeat(v.noteEtoiles || 0) + "☆".repeat(5 - (v.noteEtoiles || 0));
                    container.innerHTML += `
                        <div class="card" onclick="editVin('${child.key}', ${JSON.stringify(v).replace(/"/g, '&quot;')})">
                            <img src="${v.image || 'https://via.placeholder.com/150'}" class="img-vin">
                            <div class="vin-info">
                                <b>${v.nom}</b>
                                <span style="color:var(--gold);">${stars}</span>
                            </div>
                            <div class="vin-qte">x${v.qte}</div>
                            <button style="background:none; border:none; color:#555; font-size:20px;" onclick="event.stopPropagation(); supprimer('${child.key}')">✕</button>
                        </div>`;
                });
            });
        }

        function setStars(n) { 
            noteEtoiles = n; 
            document.querySelectorAll('#starRating span').forEach((s, i) => s.classList.toggle('selected', i < n)); 
        }

        function handleFile(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('imgData').value = e.target.result;
                document.getElementById('previewContainer').innerHTML = `<img src="${e.target.result}" style="width:100px; margin-top:10px; border-radius:8px; border:1px solid var(--gold)">`;
            };
            reader.readAsDataURL(input.files[0]);
        }

        function goToAdd() { 
            editID = null; 
            document.getElementById('nomVin').value=""; 
            document.getElementById('qteVin').value="1";
            document.getElementById('imgData').value=""; 
            document.getElementById('noteVin').value=""; 
            document.getElementById('previewContainer').innerHTML="";
            setStars(0); 
            showPage('PAGE_ADD'); 
        }

        function editVin(id, data) {
            editID = id;
            document.getElementById('nomVin').value = data.nom;
            document.getElementById('qteVin').value = data.qte;
            document.getElementById('imgData').value = data.image || "";
            document.getElementById('noteVin').value = data.note || "";
            setStars(data.noteEtoiles || 0);
            if(data.image) document.getElementById('previewContainer').innerHTML = `<img src="${data.image}" style="width:100px; margin-top:10px; border-radius:8px;">`;
            showPage('PAGE_ADD');
        }

        function sauvegarderVin() {
            const nom = document.getElementById('nomVin').value;
            if(!nom) { alert("Nom obligatoire"); return; }
            const data = {
                nom: nom,
                qte: document.getElementById('qteVin').value || 1,
                image: document.getElementById('imgData').value || "",
                noteEtoiles: noteEtoiles,
                note: document.getElementById('noteVin').value,
                categorie: rayonActuel
            };
            const ref = db.ref('users/' + userUID + '/cave');
            if(editID) ref.child(editID).update(data).then(() => showPage('PAGE_LISTE'));
            else ref.push(data).then(() => showPage('PAGE_LISTE'));
        }

        function supprimer(id) {
            if(confirm("Supprimer ce vin ?")) db.ref('users/' + userUID + '/cave/' + id).remove();
        }
    </script>
</body>
</html>
