<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;700&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.15); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; }
        .p { display: none; flex-direction: column; align-items: center; padding: 40px 15px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        .logo { width: 140px; height: auto; margin-bottom: 20px; border: 1.5px solid var(--gold); padding: 10px; border-radius: 8px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 2.4rem; margin: 20px 0; text-transform: uppercase; letter-spacing: 3px; }
        .btn-gold { background: rgba(197,160,89,0.05); border: 2px solid var(--gold); color: var(--gold); padding: 22px; width: 95%; max-width: 500px; margin: 12px 0; text-transform: uppercase; cursor: pointer; font-weight: 700; font-size: 1.2rem; border-radius: 10px; }
        .btn-google { background: white; color: #000; border: none; padding: 22px; border-radius: 10px; font-weight: 700; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; gap: 15px; margin-top: 50px; width: 95%; max-width: 500px; justify-content: center; }
        .card { background: #0d0d0d; border: 1px solid var(--brd); padding: 25px; display: flex; width: 95%; max-width: 600px; text-align: left; margin-bottom: 20px; border-radius: 15px; align-items: center; position: relative; }
        .img-vin { width: 90px; height: 120px; object-fit: cover; background: #1a1a1a; margin-right: 20px; border-radius: 8px; border: 1.5px solid var(--gold); cursor: zoom-in; }
        .vin-info { flex: 1; cursor: pointer; }
        .vin-info b { font-size: 1.6rem; display: block; margin-bottom: 8px; color: var(--gold); }
        .vin-qte { font-size: 1.8rem; font-weight: 700; color: #fff; padding-right: 10px; }
        .btn-note { font-size: 1.8rem; background: none; border: none; cursor: pointer; margin-right: 15px; filter: sepia(1) saturate(5) hue-rotate(10deg); }
        .btn-add { position: fixed; bottom: 40px; right: 25px; background: var(--gold); width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 50px; color: #000; box-shadow: 0 6px 25px rgba(197,160,89,0.6); z-index: 100; font-weight: bold; cursor: pointer; }
        .stars { font-size: 50px; color: #333; margin: 25px 0; cursor: pointer; }
        .stars .selected { color: var(--gold); }
        input, textarea { width: 95%; max-width: 500px; padding: 20px; margin: 10px 0; background: #111; color: #fff; border: 1.5px solid var(--brd); border-radius: 10px; font-size: 1.2rem; box-sizing: border-box; font-family: 'Montserrat'; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        #zoomImg { max-width: 95%; max-height: 85%; border: 2px solid var(--gold); border-radius: 10px; }
        .note-box { background: #111; border: 2px solid var(--gold); padding: 30px; width: 85%; max-width: 500px; border-radius: 15px; color: #fff; text-align: center; }
        .btn-qr { background: none; border: 1px solid gray; color: gray; padding: 10px; border-radius: 5px; margin-top: 10px; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="zoomOverlay" class="overlay" onclick="this.style.display='none'"><img id="zoomImg" src=""></div>
    
    <div id="noteOverlay" class="overlay" onclick="this.style.display='none'">
        <div class="note-box" style="text-align:left;">
            <h2 style="color:var(--gold); margin-top:0;">Commentaire :</h2>
            <p id="noteText" style="font-size:1.3rem; line-height:1.6;"></p>
            <p style="color:gray; font-size:0.9rem; text-align:center; margin-top:20px;">(Cliquer pour fermer)</p>
        </div>
    </div>

    <div id="qrOverlay" class="overlay" onclick="this.style.display='none'">
        <div class="note-box">
            <h2 style="color:var(--gold);">Partager le carnet</h2>
            <div id="qrContainer" style="background:white; padding:15px; display:inline-block; border-radius:10px; margin:20px 0;"></div>
            <p style="color:gray;">Scan ce code pour ouvrir l'appli</p>
        </div>
    </div>

    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Le Carnet de la Grappe</h1>
        <button class="btn-google" id="googleLogin"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="30"> CONNEXION GOOGLE</button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        <button class="btn-gold" onclick="openRayon('ROUGES')">🍷 ROUGES</button>
        <button class="btn-gold" onclick="openRayon('BLANCS')">🥂 BLANCS</button>
        <button class="btn-gold" onclick="openRayon('ROSES')">🌸 ROSÉS</button>
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">🍾 CHAMPAGNES</button>
        <button class="btn-qr" onclick="showQR()">🔗 MON QR CODE</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="color:gray; background:none; border:none; margin-top:40px; font-size:1.1rem; text-decoration:underline;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle"></h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="goToAdd()">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:40px; font-size:1.4rem; font-weight:700;">← RETOUR</button>
    </div>

    <div id="PAGE_ADD" class="p">
        <h1 id="addTitle">Nouveau Vin</h1>
        <input type="text" id="nomVin" placeholder="Nom du vin">
        <input type="number" id="qteVin" placeholder="Quantité" value="1">
        <button class="btn-gold" onclick="document.getElementById('fileInput').click()" style="padding:15px; font-size:1rem; border-style:dashed;">📷 PHOTO / GALERIE</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)">
        <input type="hidden" id="imgData">
        <div id="previewContainer"></div>
        <div class="stars" id="starRating">
            <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
        </div>
        <textarea id="noteVin" rows="3" placeholder="Notes..."></textarea>
        <button id="btnSave" class="btn-gold" style="background:var(--gold); color:#000;" onclick="sauvegarderVin()">ENREGISTRER</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none; margin-top:20px; font-size:1.2rem;">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID = null, rayonActuel = "", noteEtoiles = 0, editID = null;

        document.getElementById('googleLogin').onclick = () => {
            const p = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(p).catch(() => auth.signInWithRedirect(p));
        };

        auth.onAuthStateChanged(u => {
            if(u) { userUID = u.uid; document.getElementById('userName').innerText = "Cave de " + u.displayName.split(' ')[0]; showPage('PAGE_HOME'); } 
            else { showPage('PAGE_AUTH'); }
        });

        // FONCTION QR CODE MISE À JOUR POUR GITHUB
        function showQR() {
            // On appelle exactement le fichier que l'on voit sur ton GitHub (image_1.png)
            const monImage = "mon-qrcode.png"; 
            document.getElementById('qrContainer').innerHTML = `<img src="${monImage}" style="width:220px; height:220px; object-fit:contain;" alt="QR Code">`;
            document.getElementById('qrOverlay').style.display = 'flex';
        }

        function handleFile(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('imgData').value = e.target.result;
                document.getElementById('previewContainer').innerHTML = `<img src="${e.target.result}" style="width:100px; margin:10px; border-radius:5px; border:1px solid var(--gold)">`;
            };
            reader.readAsDataURL(input.files[0]);
        }

        function showPage(id) { document.querySelectorAll('.p').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
        function setStars(n) { noteEtoiles = n; document.querySelectorAll('#starRating span').forEach((s, i) => s.classList.toggle('selected', i < n)); }
        function openRayon(n) { rayonActuel = n; document.getElementById('rayonTitle').innerText = n; chargerVins(); showPage('PAGE_LISTE'); }

        function chargerVins() {
            const c = document.getElementById('container-vins');
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => {
                c.innerHTML = "";
                if(!s.exists()) { c.innerHTML = "<p style='margin-top:40px; font-size:1.4rem; color:gray;'>Rayon vide.</p>"; return; }
                s.forEach(child => {
                    const v = child.val(), id = child.key;
                    let st = "★".repeat(v.noteEtoiles || 0) + "☆".repeat(5 - (v.noteEtoiles || 0));
                    c.innerHTML += `
                        <div class="card">
                            <img src="${v.image || 'https://via.placeholder.com/150?text=Vin'}" class="img-vin" onclick="zoom('${v.image}')">
                            <div class="vin-info" onclick="editVin('${id}', ${JSON.stringify(v).replace(/"/g, '&quot;')})">
                                <b>${v.nom}</b>
                                <span style="color:var(--gold); font-size:1.6rem">${st}</span>
                            </div>
                            <button class="btn-note" onclick="voirNote('${v.note || 'Aucune note.'}')">📝</button>
                            <div class="vin-qte">x${v.qte}</div>
                            <button style="background:none; border:none; color:#ff4444; font-size:2rem; margin-left:10px;" onclick="supprimer('${id}')">✕</button>
                        </div>`;
                });
            });
        }

        function voirNote(txt) {
            document.getElementById('noteText').innerText = txt;
            document.getElementById('noteOverlay').style.display = 'flex';
        }

        function editVin(id, data) {
            editID = id;
            document.getElementById('addTitle').innerText = "Modifier le Vin";
            document.getElementById('nomVin').value = data.nom;
            document.getElementById('qteVin').value = data.qte;
            document.getElementById('imgData').value = data.image || "";
            document.getElementById('noteVin').value = data.note || "";
            setStars(data.noteEtoiles || 0);
            showPage('PAGE_ADD');
        }

        function zoom(src) { if(!src) return; document.getElementById('zoomImg').src = src; document.getElementById('zoomOverlay').style.display = 'flex'; }
        function supprimer(id) { if(confirm("Supprimer cette bouteille ?")) db.ref('users/' + userUID + '/cave/' + id).remove(); }
        function goToAdd() { editID = null; document.getElementById('addTitle').innerText = "Nouveau Vin"; document.getElementById('nomVin').value=""; document.getElementById('imgData').value=""; document.getElementById('noteVin').value=""; document.getElementById('previewContainer').innerHTML=""; setStars(0); showPage('PAGE_ADD'); }

        function sauvegarderVin() {
            const n = document.getElementById('nomVin').value;
            if(!n) return;
            const data = {
                nom: n, qte: document.getElementById('qteVin').value || 1,
                image: document.getElementById('imgData').value || "",
                noteEtoiles: noteEtoiles, note: document.getElementById('noteVin').value,
                categorie: rayonActuel
            };
            if(editID) db.ref('users/' + userUID + '/cave/' + editID).update(data).then(() => showPage('PAGE_LISTE'));
            else db.ref('users/' + userUID + '/cave').push(data).then(() => showPage('PAGE_LISTE'));
        }
    </script>
</body>
</html>
