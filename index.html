<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;700&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.15); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; overflow-x: hidden; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        
        .logo { width: 120px; height: auto; margin-bottom: 15px; border: 1.5px solid var(--gold); padding: 8px; border-radius: 8px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 2rem; margin: 15px 0; text-transform: uppercase; letter-spacing: 2px; }
        
        .intro-text { width: 90%; max-width: 450px; margin: 10px 0; padding: 15px; border-left: 2px solid var(--gold); background: rgba(197,160,89,0.05); font-size: 0.9rem; color: #ddd; line-height: 1.4; text-align: left; }
        
        /* FORMULAIRE LOGIN */
        .auth-form { width: 95%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        input, textarea { width: 100%; padding: 15px; background: #111; color: #fff; border: 1.5px solid var(--brd); border-radius: 10px; font-size: 1rem; box-sizing: border-box; font-family: 'Montserrat'; }
        input:focus { border-color: var(--gold); outline: none; }
        
        .btn-gold { background: rgba(197,160,89,0.1); border: 2px solid var(--gold); color: var(--gold); padding: 18px; width: 100%; margin: 5px 0; text-transform: uppercase; cursor: pointer; font-weight: 700; font-size: 1rem; border-radius: 10px; }
        .btn-main { background: var(--gold); color: #000; border: none; padding: 18px; width: 100%; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        
        /* RESTE DU STYLE (Inchangé) */
        .card { background: #0d0d0d; border: 1px solid var(--brd); padding: 15px; display: flex; width: 98%; max-width: 600px; text-align: left; margin-bottom: 12px; border-radius: 12px; align-items: center; position: relative; box-sizing: border-box; }
        .img-vin { width: 70px; height: 100px; object-fit: cover; background: #1a1a1a; margin-right: 15px; border-radius: 6px; border: 1.5px solid var(--gold); }
        .vin-info { flex: 1; }
        .vin-info b { font-size: 1.2rem; display: block; color: var(--gold); }
        .vin-qte { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .btn-add { position: fixed; bottom: 30px; right: 20px; background: var(--gold); width: 65px; height: 65px; border-radius: 50%; border: none; font-size: 35px; color: #000; z-index: 100; cursor: pointer; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        .stars { font-size: 35px; color: #333; margin: 15px 0; cursor: pointer; }
        .stars .selected { color: var(--gold); }
    </style>
</head>
<body>

    <!-- CONNEXION / INSCRIPTION -->
    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Le Carnet de la Grappe</h1>
        <div class="intro-text"><b>Votre cave, toujours dans votre poche.</b></div>
        
        <div class="auth-form">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Mot de passe">
            <button class="btn-main" onclick="connexion()">Se Connecter</button>
            <button class="btn-gold" style="font-size: 0.8rem;" onclick="inscription()">Créer un compte</button>
            <p id="authError" style="color: #ff4444; font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- ACCUEIL -->
    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        <button class="btn-gold" onclick="openRayon('ROUGES')">🍷 ROUGES</button>
        <button class="btn-gold" onclick="openRayon('BLANCS')">🥂 BLANCS</button>
        <button class="btn-gold" onclick="openRayon('ROSES')">🌸 ROSÉS</button>
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">🍾 CHAMPAGNES</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="color:gray; background:none; border:none; margin-top:30px; text-decoration:underline;">Déconnexion</button>
    </div>

    <!-- LISTE VINS -->
    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle"></h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="goToAdd()">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:30px; font-weight:700;">← RETOUR</button>
    </div>

    <!-- AJOUT / MODIF -->
    <div id="PAGE_ADD" class="p">
        <h1 id="addTitle">Nouveau Vin</h1>
        <input type="text" id="nomVin" placeholder="Nom du vin">
        <input type="number" id="qteVin" placeholder="Quantité" value="1">
        <button class="btn-gold" onclick="document.getElementById('fileInput').click()" style="border-style:dashed;">📷 PHOTO / GALERIE</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)">
        <div id="previewContainer"></div>
        <input type="hidden" id="imgData">
        <div class="stars" id="starRating">
            <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
        </div>
        <textarea id="noteVin" placeholder="Notes de dégustation..."></textarea>
        <button id="btnSave" class="btn-main" onclick="sauvegarderVin()">ENREGISTRER</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none; margin-top:15px;">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID = null, rayonActuel = "", noteEtoiles = 0, editID = null;

        // --- NOUVELLES FONCTIONS D'AUTH ---
        function connexion() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => {
                document.getElementById('authError').innerText = "Erreur : Email ou mot de passe incorrect.";
            });
        }

        function inscription() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            if(p.length < 6) { alert("Le mot de passe doit faire 6 caractères minimum."); return; }
            auth.createUserWithEmailAndPassword(e, p).catch(err => {
                document.getElementById('authError').innerText = "Erreur : Cet email est peut-être déjà utilisé.";
            });
        }

        auth.onAuthStateChanged(u => {
            if(u) { userUID = u.uid; document.getElementById('userName').innerText = "Ma Cave"; showPage('PAGE_HOME'); } 
            else { showPage('PAGE_AUTH'); }
        });

        // --- LOGIQUE DE L'APP (Inchangée) ---
        function showPage(id) { document.querySelectorAll('.p').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
        function setStars(n) { noteEtoiles = n; document.querySelectorAll('#starRating span').forEach((s, i) => s.classList.toggle('selected', i < n)); }
        function openRayon(n) { rayonActuel = n; document.getElementById('rayonTitle').innerText = n; chargerVins(); showPage('PAGE_LISTE'); }

        function chargerVins() {
            const c = document.getElementById('container-vins');
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => {
                c.innerHTML = "";
                if(!s.exists()) { c.innerHTML = "<p style='color:gray;'>Rayon vide.</p>"; return; }
                s.forEach(child => {
                    const v = child.val(), id = child.key;
                    let st = "★".repeat(v.noteEtoiles || 0) + "☆".repeat(5 - (v.noteEtoiles || 0));
                    c.innerHTML += `
                        <div class="card">
                            <img src="${v.image || 'https://via.placeholder.com/150'}" class="img-vin">
                            <div class="vin-info" onclick="editVin('${id}', ${JSON.stringify(v).replace(/"/g, '&quot;')})">
                                <b>${v.nom}</b>
                                <span style="color:var(--gold);">${st}</span>
                            </div>
                            <div class="vin-qte">x${v.qte}</div>
                            <button style="background:none; border:none; color:#ff4444; font-size:1.5rem; margin-left:10px;" onclick="supprimer('${id}')">✕</button>
                        </div>`;
                });
            });
        }

        function handleFile(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('imgData').value = e.target.result;
                document.getElementById('previewContainer').innerHTML = `<img src="${e.target.result}" style="width:80px; margin:10px; border-radius:5px; border:1px solid var(--gold)">`;
            };
            reader.readAsDataURL(input.files[0]);
        }

        function editVin(id, data) {
            editID = id;
            document.getElementById('addTitle').innerText = "Modifier";
            document.getElementById('nomVin').value = data.nom;
            document.getElementById('qteVin').value = data.qte;
            document.getElementById('imgData').value = data.image || "";
            document.getElementById('noteVin').value = data.note || "";
            if(data.image) document.getElementById('previewContainer').innerHTML = `<img src="${data.image}" style="width:80px; margin:10px; border-radius:5px; border:1px solid var(--gold)">`;
            setStars(data.noteEtoiles || 0);
            showPage('PAGE_ADD');
        }

        function supprimer(id) { if(confirm("Supprimer ce vin ?")) db.ref('users/' + userUID + '/cave/' + id).remove(); }
        function goToAdd() { editID = null; document.getElementById('addTitle').innerText = "Nouveau Vin"; document.getElementById('nomVin').value=""; document.getElementById('imgData').value=""; document.getElementById('noteVin').value=""; document.getElementById('previewContainer').innerHTML=""; setStars(0); showPage('PAGE_ADD'); }

        function sauvegarderVin() {
            const n = document.getElementById('nomVin').value;
            if(!n) return;
            const data = {
                nom: n, qte: document.getElementById('qteVin').value || 1,
                image: document.getElementById('imgData').value || "",
                noteEtoiles: noteEtoiles, note: document.getElementById('noteVin').value,
                categorie: rayonActuel
            };
            if(editID) db.ref('users/' + userUID + '/cave/' + editID).update(data).then(() => showPage('PAGE_LISTE'));
            else db.ref('users/' + userUID + '/cave').push(data).then(() => showPage('PAGE_LISTE'));
        }
    </script>
</body>
</html>
