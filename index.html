<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@300;600&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.1); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        .logo { width: 100px; height: auto; margin: 15px auto; border: 1px solid var(--gold); padding: 8px; border-radius: 5px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 1.4rem; margin: 10px 0; text-transform: uppercase; }
        .btn-gold { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 15px; width: 90%; max-width: 320px; margin: 8px 0; text-transform: uppercase; cursor: pointer; font-weight: bold; }
        .btn-google { background: white; color: #000; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-top: 20px; font-size: 1rem; }
        .stars { font-size: 30px; color: #444; margin: 10px 0; cursor: pointer; }
        .stars .selected { color: var(--gold); }
        .card { background: #0a0a0a; border: 1px solid var(--brd); padding: 12px; display: flex; width: 100%; max-width: 500px; text-align: left; margin-bottom: 8px; border-radius: 8px; align-items: center; position: relative; }
        .img-vin { width: 50px; height: 70px; object-fit: cover; background: #1a1a1a; margin-right: 15px; border-radius: 4px; }
        .actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 10px; font-size: 11px; }
        #photoPreview { width: 100px; height: 130px; background: #1a1a1a; border: 1px dashed var(--gold); margin: 10px 0; object-fit: cover; display: none; }
        #photoPreview[src^="data"] { display: block; }
        .camera-btn { background: #222; border: 1px solid #444; color: #fff; padding: 12px; width: 90%; margin: 5px 0; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }
        .btn-add { position: fixed; bottom: 30px; right: 20px; background: var(--gold); width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 35px; color: #000; z-index: 100; box-shadow: 0 0 15px var(--gold); }
        input, textarea { width: 90%; padding: 12px; margin: 5px 0; background: #111; color: #fff; border: 1px solid var(--brd); border-radius: 5px; font-size: 16px; }
    </style>
</head>
<body>

    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Le Carnet de la Grappe</h1>
        <button class="btn-google" onclick="login()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
            Continuer avec Google
        </button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        <button class="btn-gold" onclick="openRayon('ROUGES')">Vins Rouges</button>
        <button class="btn-gold" onclick="openRayon('BLANCS')">Vins Blancs</button>
        <button class="btn-gold" onclick="openRayon('ROSES')">Vins Rosés</button>
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">Champagnes</button>
        <button onclick="logout()" style="color:gray; background:none; border:none; margin-top:30px; text-decoration: underline;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle">Rayon</h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="goToAdd()">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:20px;">← ACCUEIL</button>
    </div>

    <div id="PAGE_ADD" class="p">
        <h1 id="formTitle">Ajouter un Vin</h1>
        <input type="hidden" id="editId">
        <img id="photoPreview" src="">
        <label class="camera-btn">
             📸 PRENDRE UNE PHOTO
            <input type="file" id="inputFile" accept="image/*" capture="environment" style="display:none" onchange="previewImage(this)">
        </label>
        <input type="text" id="nomVin" placeholder="Nom du Vin">
        <input type="number" id="qteVin" placeholder="Bouteilles" value="1">
        <div class="stars" id="starRating">
            <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
        </div>
        <textarea id="noteVin" placeholder="Commentaires..."></textarea>
        <button class="btn-gold" style="background:var(--gold); color:#000;" onclick="sauvegarderVin()">Enregistrer</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none; margin-top:10px;">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let userUID = null, rayonActuel = "", noteEtoiles = 0, currentPhotoData = "";

        // MODIFICATION POUR L'APPLI MOBILE
        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            // On utilise impérativement le Redirect pour les applis mobiles
            auth.signInWithRedirect(provider);
        }

        // On récupère le résultat de la connexion après le retour sur l'appli
        auth.getRedirectResult().catch((error) => {
            if(error.code === 'auth/internal-error') {
                alert("Erreur de connexion. Essayez d'ouvrir le site dans votre navigateur Chrome avant d'utiliser l'appli.");
            }
        });

        function logout() { auth.signOut().then(() => window.location.reload()); }

        auth.onAuthStateChanged(user => {
            if (user) { 
                userUID = user.uid; 
                document.getElementById('userName').innerText = "Cave de " + user.displayName; 
                showPage('PAGE_HOME'); 
            } else { 
                showPage('PAGE_AUTH'); 
            }
        });

        function showPage(id) {
            document.querySelectorAll('.p').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentPhotoData = e.target.result;
                    document.getElementById('photoPreview').src = currentPhotoData;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function setStars(n) {
            noteEtoiles = n;
            document.querySelectorAll('#starRating span').forEach((s, i) => s.classList.toggle('selected', i < n));
        }

        function openRayon(nom) {
            rayonActuel = nom; document.getElementById('rayonTitle').innerText = nom;
            chargerVins(); showPage('PAGE_LISTE');
        }

        function chargerVins() {
            const container = document.getElementById('container-vins');
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', snap => {
                container.innerHTML = "";
                const data = snap.val();
                if (!data) { container.innerHTML = "<p>Aucun vin.</p>"; return; }
                Object.entries(data).forEach(([id, v]) => {
                    let starHTML = "★".repeat(v.noteEtoiles || 0) + "☆".repeat(5 - (v.noteEtoiles || 0));
                    container.innerHTML += `<div class="card">
                        <div class="actions">
                            <span style="color:#5bc0de" onclick="editVin('${id}')">Editer</span>
                            <span style="color:#d9534f" onclick="deleteVin('${id}')">X</span>
                        </div>
                        <img src="${v.image || ''}" class="img-vin">
                        <div style="flex:1">
                            <b>${v.nom}</b><br>
                            <span style="color:var(--gold)">${starHTML}</span><br>
                            <small>${v.note || ''}</small>
                        </div>
                        <div style="font-weight:bold; color:var(--gold)">x${v.qte}</div>
                    </div>`;
                });
            });
        }

        function goToAdd() {
            document.getElementById('editId').value = "";
            document.getElementById('formTitle').innerText = "Ajouter un Vin";
            document.getElementById('nomVin').value = "";
            document.getElementById('photoPreview').src = "";
            currentPhotoData = "";
            document.getElementById('noteVin').value = "";
            setStars(0); showPage('PAGE_ADD');
        }

        function editVin(id) {
            db.ref('users/' + userUID + '/cave/' + id).once('value', snap => {
                const v = snap.val();
                document.getElementById('editId').value = id;
                document.getElementById('formTitle').innerText = "Modifier le Vin";
                document.getElementById('nomVin').value = v.nom;
                document.getElementById('qteVin').value = v.qte;
                document.getElementById('photoPreview').src = v.image || "";
                currentPhotoData = v.image || "";
                document.getElementById('noteVin').value = v.note || "";
                setStars(v.noteEtoiles || 0);
                showPage('PAGE_ADD');
            });
        }

        function deleteVin(id) { if(confirm("Supprimer ce vin ?")) db.ref('users/' + userUID + '/cave/' + id).remove(); }

        function sauvegarderVin() {
            const id = document.getElementById('editId').value;
            const data = {
                nom: document.getElementById('nomVin').value,
                qte: document.getElementById('qteVin').value,
                image: currentPhotoData,
                noteEtoiles: noteEtoiles,
                note: document.getElementById('noteVin').value,
                categorie: rayonActuel
            };
            if(!data.nom) return alert("Le nom est obligatoire");
            const ref = id ? db.ref('users/' + userUID + '/cave/' + id) : db.ref('users/' + userUID + '/cave').push();
            ref.set(data).then(() => showPage('PAGE_LISTE'));
        }
    </script>
</body>
</html>
