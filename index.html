<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@300;600&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.1); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        .logo { width: 120px; margin: 20px auto; border: 1px solid var(--gold); padding: 10px; border-radius: 5px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); text-transform: uppercase; font-size: 1.5rem; }
        .btn-gold { background: var(--gold); color: #000; border: none; padding: 15px; width: 90%; max-width: 320px; margin: 10px 0; text-transform: uppercase; cursor: pointer; font-weight: bold; }
        .btn-outline { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 15px; width: 90%; max-width: 320px; margin: 10px 0; text-transform: uppercase; cursor: pointer; }
        .card { background: #0a0a0a; border: 1px solid var(--brd); padding: 15px; display: flex; width: 100%; max-width: 500px; text-align: left; margin-bottom: 10px; border-radius: 8px; align-items: center; position: relative; }
        .img-vin { width: 70px; height: 90px; object-fit: cover; background: #1a1a1a; margin-right: 15px; border-radius: 4px; border: 1px solid var(--gold); }
        .stars { font-size: 25px; color: #444; cursor: pointer; margin: 10px 0; }
        .stars .selected { color: var(--gold); }
        input, textarea { width: 90%; padding: 12px; margin: 8px 0; background: #111; color: #fff; border: 1px solid var(--brd); border-radius: 5px; font-family: 'Montserrat', sans-serif; }
        .btn-add { position: fixed; bottom: 30px; right: 20px; background: var(--gold); width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 35px; color: #000; z-index: 100; }
    </style>
</head>
<body>

    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Mon Carnet</h1>
        <input type="email" id="emailAuth" placeholder="Email">
        <input type="password" id="passAuth" placeholder="Mot de passe">
        <button class="btn-gold" onclick="connexion()">Se Connecter</button>
        <button class="btn-outline" onclick="inscription()">Créer un compte</button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1>Ma Cave</h1>
        <button class="btn-outline" onclick="openRayon('ROUGES')">Vins Rouges</button>
        <button class="btn-outline" onclick="openRayon('BLANCS')">Vins Blancs</button>
        <button class="btn-outline" onclick="openRayon('ROSES')">Vins Rosés</button>
        <button class="btn-outline" onclick="openRayon('CHAMPAGNES')">Champagnes</button>
        <button onclick="deconnexion()" style="color:gray; background:none; border:none; margin-top:20px;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle">Rayon</h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="ouvrirAjout()">+</button>
        <button class="btn-outline" onclick="showPage('PAGE_HOME')">Retour</button>
    </div>

    <div id="PAGE_FORM" class="p">
        <h1 id="formTitle">Détails</h1>
        <input type="text" id="nomVin" placeholder="Nom du vin">
        <input type="number" id="qteVin" value="1">
        <input type="text" id="imgVin" placeholder="Colle ta photo ici">
        <div class="stars" id="starRating">
            <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
        </div>
        <textarea id="noteVin" placeholder="Notes..."></textarea>
        <button class="btn-gold" onclick="validerVin()">Valider</button>
        <button class="btn-outline" onclick="showPage('PAGE_LISTE')">Annuler</button>
        <button onclick="supprimerVin()" id="btnSuppr" style="color:red; background:none; border:none; margin-top:15px; display:none;">Supprimer ce vin</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let userUID = null, rayonActuel = "", noteEtoiles = 0, idSelectionne = null;

        function inscription() {
            auth.createUserWithEmailAndPassword(document.getElementById('emailAuth').value, document.getElementById('passAuth').value).catch(e => alert(e.message));
        }
        function connexion() {
            auth.signInWithEmailAndPassword(document.getElementById('emailAuth').value, document.getElementById('passAuth').value).catch(e => alert(e.message));
        }
        function deconnexion() { auth.signOut().then(() => window.location.reload()); }

        auth.onAuthStateChanged(user => {
            if (user) { userUID = user.uid; showPage('PAGE_HOME'); }
            else { showPage('PAGE_AUTH'); }
        });

        function showPage(id) {
            document.querySelectorAll('.p').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function setStars(n) {
            noteEtoiles = n;
            document.querySelectorAll('#starRating span').forEach((s, i) => s.classList.toggle('selected', i < n));
        }

        function openRayon(nom) {
            rayonActuel = nom;
            document.getElementById('rayonTitle').innerText = nom;
            chargerVins();
            showPage('PAGE_LISTE');
        }

        function chargerVins() {
            const container = document.getElementById('container-vins');
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', snap => {
                container.innerHTML = "";
                if (!snap.val()) return container.innerHTML = "<p>Vide</p>";
                Object.entries(snap.val()).forEach(([id, v]) => {
                    let stars = "★".repeat(v.noteEtoiles || 0) + "☆".repeat(5-(v.noteEtoiles || 0));
                    container.innerHTML += `
                        <div class="card" onclick="ouvrirModif('${id}')">
                            <img src="${v.image}" class="img-vin" onerror="this.src='https://via.placeholder.com/70x90?text=Erreur'">
                            <div style="flex:1">
                                <b>${v.nom}</b><br><small style="color:var(--gold)">${stars}</small>
                            </div>
                            <b>x${v.qte}</b>
                        </div>`;
                });
            });
        }

        function ouvrirAjout() {
            idSelectionne = null;
            document.getElementById('nomVin').value = "";
            document.getElementById('imgVin').value = "";
            document.getElementById('noteVin').value = "";
            document.getElementById('btnSuppr').style.display = "none";
            setStars(0);
            showPage('PAGE_FORM');
        }

        function ouvrirModif(id) {
            idSelectionne = id;
            document.getElementById('btnSuppr').style.display = "block";
            db.ref('users/' + userUID + '/cave/' + id).once('value', snap => {
                const v = snap.val();
                document.getElementById('nomVin').value = v.nom;
                document.getElementById('qteVin').value = v.qte;
                document.getElementById('imgVin').value = v.image || "";
                document.getElementById('noteVin').value = v.note || "";
                setStars(v.noteEtoiles || 0);
                showPage('PAGE_FORM');
            });
        }

        function validerVin() {
            const data = {
                nom: document.getElementById('nomVin').value,
                qte: document.getElementById('qteVin').value,
                image: document.getElementById('imgVin').value,
                noteEtoiles: noteEtoiles,
                note: document.getElementById('noteVin').value,
                categorie: rayonActuel
            };
            if(idSelectionne) db.ref('users/' + userUID + '/cave/' + idSelectionne).set(data).then(() => showPage('PAGE_LISTE'));
            else db.ref('users/' + userUID + '/cave').push(data).then(() => showPage('PAGE_LISTE'));
        }

        function supprimerVin() {
            if(confirm("Supprimer ce vin ?")) {
                db.ref('users/' + userUID + '/cave/' + idSelectionne).remove().then(() => showPage('PAGE_LISTE'));
            }
        }
    </script>
</body>
</html>
