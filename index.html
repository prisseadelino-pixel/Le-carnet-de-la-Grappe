<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@300;600&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.1); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        .logo { width: 100px; margin: 20px auto; border: 1px solid var(--gold); padding: 10px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); text-transform: uppercase; font-size: 1.4rem; }
        .btn-gold { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 15px; width: 90%; max-width: 300px; margin: 10px 0; text-transform: uppercase; cursor: pointer; font-weight: bold; }
        .btn-google { background: white; color: #000; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; margin: 20px auto; }
        .btn-add { position: fixed; bottom: 30px; right: 20px; background: var(--gold); width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 35px; color: #000; z-index: 100; cursor: pointer; }
        .card { background: #0a0a0a; border: 1px solid var(--brd); padding: 10px; display: flex; width: 100%; margin-bottom: 10px; align-items: center; text-align: left; border-radius: 5px; }
        .img-vin { width: 50px; height: 70px; object-fit: cover; margin-right: 15px; background: #1a1a1a; }
        input, textarea { width: 90%; padding: 12px; margin: 8px 0; background: #111; color: #fff; border: 1px solid var(--brd); border-radius: 5px; }
        .stars span { font-size: 30px; color: #444; cursor: pointer; }
        .stars .selected { color: var(--gold); }
    </style>
</head>
<body>
    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Le Carnet</h1>
        <button class="btn-google" onclick="login()">Se connecter avec Google</button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        <button class="btn-gold" onclick="openRayon('ROUGES')">Vins Rouges</button>
        <button class="btn-gold" onclick="openRayon('BLANCS')">Vins Blancs</button>
        <button class="btn-gold" onclick="openRayon('ROSES')">Vins Rosés</button>
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">Champagnes</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="color:gray; background:none; border:none; margin-top:30px;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle"></h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="showPage('PAGE_ADD')">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:20px;">← RETOUR</button>
    </div>

    <div id="PAGE_ADD" class="p">
        <h1>Nouveau Vin</h1>
        <input type="text" id="nomVin" placeholder="Nom du vin">
        <input type="number" id="qteVin" placeholder="Quantité" value="1">
        <input type="text" id="imgVin" placeholder="Lien photo (URL)">
        <div class="stars" id="starRating">
            <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
        </div>
        <textarea id="noteVin" placeholder="Notes perso..."></textarea>
        <button class="btn-gold" style="background:var(--gold); color:#000;" onclick="sauvegarderVin()">Enregistrer</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none; margin-top:10px;">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID = null, rayonActuel = "", noteEtoiles = 0;

        function login() { 
            const p = new firebase.auth.GoogleAuthProvider(); 
            auth.signInWithPopup(p).catch(() => auth.signInWithRedirect(p)); 
        }

        auth.onAuthStateChanged(u => {
            if(u) { 
                userUID = u.uid; 
                document.getElementById('userName').innerText = "Cave de " + u.displayName;
                showPage('PAGE_HOME'); 
            } else { showPage('PAGE_AUTH'); }
        });

        function showPage(id) {
            document.querySelectorAll('.p').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function setStars(n) {
            noteEtoiles = n;
            document.querySelectorAll('#starRating span').forEach((s, i) => s.classList.toggle('selected', i < n));
        }

        function openRayon(n) {
            rayonActuel = n;
            document.getElementById('rayonTitle').innerText = n;
            showPage('PAGE_LISTE'); // On affiche la page d'abord pour débloquer le bouton +
            chargerVins();
        }

        function chargerVins() {
            const c = document.getElementById('container-vins');
            c.innerHTML = "<p>Chargement...</p>";
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => {
                c.innerHTML = "";
                const data = s.val();
                if(!data) { c.innerHTML = "<p style='opacity:0.5'>Aucun vin ici.</p>"; return; }
                Object.entries(data).forEach(([id, v]) => {
                    let st = "★".repeat(v.noteEtoiles || 0) + "☆".repeat(5 - (v.noteEtoiles || 0));
                    c.innerHTML += `<div class="card"><img src="${v.image || 'https://via.placeholder.com/50x70'}" class="img-vin"><div><b>${v.nom}</b><br><span style="color:var(--gold)">${st}</span></div><div style="margin-left:auto">x${v.qte}</div></div>`;
                });
            }, (err) => {
                c.innerHTML = "<p style='color:red'>Erreur de connexion base de données.</p>";
            });
        }

        function sauvegarderVin() {
            const n = document.getElementById('nomVin').value;
            if(!n) return alert("Nom requis");
            db.ref('users/' + userUID + '/cave').push({
                nom: n,
                qte: document.getElementById('qteVin').value,
                image: document.getElementById('imgVin').value,
                noteEtoiles: noteEtoiles,
                note: document.getElementById('noteVin').value,
                categorie: rayonActuel
            }).then(() => showPage('PAGE_LISTE'));
        }
    </script>
</body>
</html>
