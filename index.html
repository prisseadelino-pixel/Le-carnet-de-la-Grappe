<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg">

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;700&display=swap');
        
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(197, 160, 89, 0.3); }
        
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 1.6rem; text-transform: uppercase; letter-spacing: 3px; margin: 25px 0; }

        .btn-rayon { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--brd); color: var(--gold); 
            padding: 0 25px; width: 92%; max-width: 480px; margin: 12px 0; 
            text-transform: uppercase; cursor: pointer; font-weight: 700; border-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between; min-height: 110px;
        }
        .icon-large { font-size: 3.5rem; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }

        .logo-frame { width: 130px; height: 130px; border: 1px solid var(--gold); border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; background: #0a0a0a; overflow: hidden; }
        .intro-text { width: 90%; max-width: 450px; margin-bottom: 30px; padding: 25px; border: 1px solid var(--brd); border-radius: 15px; font-size: 0.95rem; background: rgba(197,160,89,0.05); line-height: 1.5; }
        .intro-text b { color: var(--gold); display: block; margin-bottom: 8px; font-size: 1.1rem; }
        
        .card { background: #0d0d0d; border: 1px solid rgba(255,255,255,0.1); padding: 15px; width: 98%; max-width: 500px; margin-bottom: 12px; border-radius: 12px; display: flex; align-items: center; }
        .img-vin { width: 65px; height: 95px; object-fit: cover; border-radius: 6px; border: 1px solid var(--gold); margin-right: 15px; cursor: pointer; }
        .vin-info { flex: 1; text-align: left; }
        .vin-info b { color: var(--gold); font-size: 1.1rem; display: block; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #111; padding: 25px; border-radius: 15px; border: 1px solid var(--gold); width: 85%; max-width: 400px; }
        
        .qr-wrapper { background: white; padding: 15px; border-radius: 10px; margin: 20px auto; display: inline-block; position: relative; }
        #qrImg { width: 180px; height: 180px; display: block; }
        .qr-center-logo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 45px; height: 45px; border-radius: 6px; background: white; padding: 2px; border: 1px solid #ddd; }

        .btn-action { background: var(--gold); color: #000; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        input, textarea { width: 100%; padding: 16px; margin: 10px 0; background: #111; color: #fff; border: 1px solid #333; border-radius: 12px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="imgModal" class="modal" onclick="this.style.display='none'">
        <img id="imgZoomDisplay" style="max-width:90%; max-height:80vh; border:1px solid var(--gold); border-radius:10px;">
    </div>

    <div id="noteModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="color:var(--gold); font-family:'Bodoni Moda'">CARNET DE NOTES</h2>
            <div id="noteVinDisplay" style="background:white; color:#222; padding:20px; border-radius:8px; text-align:left; font-style:italic; line-height:1.6; margin-bottom:15px; white-space: pre-wrap;"></div>
            <button onclick="document.getElementById('noteModal').style.display='none'" class="btn-action">FERMER</button>
        </div>
    </div>

    <div id="qrModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="color:var(--gold); font-family:'Bodoni Moda'">MON QR CODE</h2>
            <div class="qr-wrapper">
                <img id="qrImg" src="">
                <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="qr-center-logo">
            </div>
            <button onclick="document.getElementById('qrModal').style.display='none'" class="btn-action">FERMER</button>
        </div>
    </div>

    <div id="PAGE_AUTH" class="p active">
        <div class="logo-frame"><img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" style="width:100%"></div>
        <h1>Le Carnet de la Grappe</h1>
        <div class="intro-text">
            <b>Votre cave, toujours dans votre poche</b>
            <span>Inventorier vos crus, gérez vos stocks et conservez vos notes précieuses.</span>
        </div>
        <button id="googleLogin" class="btn-action" style="background:white; color:black; width:90%;">CONNEXION GOOGLE</button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1 id="userName">MA CAVE</h1>
        
        <button class="btn-rayon" onclick="openRayon('ROUGES')">
            <span>VINS ROUGES</span>
            <span class="icon-large">🍷</span>
        </button>
        
        <button class="btn-rayon" onclick="openRayon('BLANCS')">
            <span>VINS BLANCS</span>
            <span class="icon-large">🥂</span>
        </button>
        
        <button class="btn-rayon" onclick="openRayon('ROSES')">
            <span>VINS ROSÉS</span>
            <span class="icon-large">🍷</span>
        </button>
        
        <button class="btn-rayon" onclick="openRayon('CHAMPAGNES')">
            <span>CHAMPAGNES</span>
            <span class="icon-large">🍾</span>
        </button>

        <button onclick="genererQR()" style="background:rgba(255,255,255,0.05); border:1px solid #333; color:#aaa; padding:12px 25px; border-radius:10px; margin-top:25px; cursor:pointer;">🔗 MON QR CODE</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="background:none; border:none; color:#555; margin-top:30px; text-decoration:underline;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle"></h1>
        <div id="container-vins" style="width:100%; max-width:500px;"></div>
        <button onclick="goToAdd()" style="position:fixed; bottom:30px; right:25px; background:var(--gold); width:65px; height:65px; border-radius:50%; border:none; font-size:35px; font-weight:bold; box-shadow: 0 5px 15px rgba(0,0,0,0.4);">+</button>
        <button onclick="showPage('PAGE_HOME')" style="background:none; border:none; color:var(--gold); font-weight:700; margin-top:30px;">← RETOUR</button>
    </div>

    <div id="PAGE_ADD" class="p">
        <h1 id="addTitle">AJOUTER</h1>
        <input type="text" id="nomVin" placeholder="Nom du vin">
        <input type="number" id="qteVin" placeholder="Quantité">
        <button class="btn-action" style="background:#222; color:var(--gold); border:1px dashed var(--gold)" onclick="document.getElementById('fileInput').click()">📷 PHOTO</button>
        <input type="file" id="fileInput" style="display:none" onchange="handleFile(this)">
        <div id="preview"></div>
        <textarea id="noteVin" rows="5" placeholder="Notes de dégustation..."></textarea>
        <button class="btn-action" onclick="sauvegarderVin()">ENREGISTRER</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none; margin-top:15px;">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyABRweq9NpgFHy9tWpN8UhD0nBdTmZ-7dU",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID = null, rayonActuel = "", currentImg = "", editID = null;

        document.getElementById('googleLogin').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        auth.onAuthStateChanged(u => { if(u){ userUID = u.uid; document.getElementById('userName').innerText = "CAVE DE " + u.displayName.split(' ')[0].toUpperCase(); showPage('PAGE_HOME'); } else showPage('PAGE_AUTH'); });

        function showPage(id) { document.querySelectorAll('.p').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
        function openRayon(n) { rayonActuel = n; document.getElementById('rayonTitle').innerText = n === "CHAMPAGNES" ? n : "VINS " + n; chargerVins(); showPage('PAGE_LISTE'); }

        function zoomPhoto(url) {
            const modal = document.getElementById('imgModal');
            document.getElementById('imgZoomDisplay').src = url;
            modal.style.display = 'flex';
        }

        function chargerVins() {
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => {
                const c = document.getElementById('container-vins'); c.innerHTML = "";
                s.forEach(child => {
                    const v = child.val(), id = child.key;
                    const cleanNote = v.note ? v.note.replace(/'/g, "\\'").replace(/\n/g, " ") : "";
                    const imgUrl = v.image || 'https://via.placeholder.com/150';
                    
                    c.innerHTML += `<div class="card">
                        <img src="${imgUrl}" class="img-vin" onclick="zoomPhoto('${imgUrl}')">
                        <div class="vin-info">
                            <b onclick="prepareEdit('${id}', ${JSON.stringify(v).replace(/"/g, '&quot;')})">${v.nom}</b>
                            ${v.note ? `<button onclick="document.getElementById('noteVinDisplay').innerText='${cleanNote}'; document.getElementById('noteModal').style.display='flex'" style="background:none; border:1px solid var(--gold); color:var(--gold); border-radius:10px; font-size:0.65rem; padding:4px 10px; margin-top:5px; cursor:pointer;">📒 NOTE</button>` : ''}
                        </div>
                        <div style="font-size:1.4rem; font-weight:bold; padding:0 10px;">x${v.qte}</div>
                        <button onclick="if(confirm('Supprimer ?')) db.ref('users/${userUID}/cave/${id}').remove()" style="background:none; border:none; color:red; font-size:1.2rem;">✕</button>
                    </div>`;
                });
            });
        }

        function handleFile(i) { const r = new FileReader(); r.onload = (e) => { currentImg = e.target.result; document.getElementById('preview').innerHTML = `<img src="${currentImg}" style="width:80px; margin-top:15px; border-radius:8px; border:1px solid var(--gold);">`; }; r.readAsDataURL(i.files[0]); }
        function goToAdd() { editID = null; document.getElementById('nomVin').value = ""; document.getElementById('qteVin').value = 1; document.getElementById('noteVin').value = ""; document.getElementById('preview').innerHTML = ""; currentImg = ""; showPage('PAGE_ADD'); }
        function prepareEdit(id, v) { editID = id; document.getElementById('nomVin').value = v.nom; document.getElementById('qteVin').value = v.qte; document.getElementById('noteVin').value = v.note || ""; currentImg = v.image || ""; document.getElementById('preview').innerHTML = v.image ? `<img src="${v.image}" style="width:80px; border-radius:8px;">` : ""; showPage('PAGE_ADD'); }
        
        function sauvegarderVin() {
            const nom = document.getElementById('nomVin').value; if(!nom) return;
            const data = { nom, qte: document.getElementById('qteVin').value, note: document.getElementById('noteVin').value, image: currentImg, categorie: rayonActuel };
            if(editID) db.ref('users/' + userUID + '/cave/' + editID).update(data).then(() => showPage('PAGE_LISTE'));
            else db.ref('users/' + userUID + '/cave').push(data).then(() => showPage('PAGE_LISTE'));
        }

        function genererQR() {
            const url = window.location.href;
            document.getElementById('qrImg').src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(url);
            document.getElementById('qrModal').style.display = 'flex';
        }
    </script>
</body>
</html>
