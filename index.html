<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="La Grappe">
    <link rel="apple-touch-icon" href="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg">
    <link rel="icon" type="image/jpg" href="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg">

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;700&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.15); }
        
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; overflow-x: hidden; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        
        .logo { width: 120px; height: auto; margin-bottom: 15px; border: 1.5px solid var(--gold); padding: 8px; border-radius: 8px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 1.8rem; margin: 15px 0; text-transform: uppercase; letter-spacing: 2px; }
        
        .intro-text { 
            width: 90%; max-width: 450px; margin: 15px 0 25px 0; padding: 20px; 
            border: 1px solid rgba(197,160,89,0.3); 
            background: linear-gradient(145deg, rgba(255,255,255,0.02) 0%, rgba(197,160,89,0.05) 100%);
            border-radius: 15px; font-size: 1rem; line-height: 1.6; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .intro-text b { 
            display: block; margin-bottom: 8px;
            background: linear-gradient(to right, #fff, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 1.1rem; letter-spacing: 1px;
        }
        .intro-text span { color: #ccc; font-weight: 400; }

        .btn-gold { 
            background: rgba(197,160,89,0.05); border: 1.5px solid var(--gold); color: var(--gold); 
            padding: 0 30px; width: 95%; max-width: 600px; margin: 10px 0; 
            text-transform: uppercase; cursor: pointer; font-weight: 700; font-size: 1.1rem; 
            border-radius: 12px; display: flex; align-items: center; justify-content: space-between;
            box-sizing: border-box; min-height: 100px; transition: 0.2s;
        }
        .btn-gold:active { background: rgba(197,160,89,0.1); }
        .btn-gold svg { height: 80px; width: auto; flex-shrink: 0; }

        /* MODAL QR */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #111; padding: 30px; border-radius: 15px; border: 2px solid var(--gold); text-align: center; width: 85%; max-width: 400px; }
        .qr-wrapper { width: 260px; height: 260px; margin: 20px auto; background: white; padding: 10px; border-radius: 10px; display: flex; justify-content: center; align-items: center; }
        .qr-wrapper img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }

        /* MODAL IMAGE GRANDE */
        .modal-img { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.97); z-index: 4000; justify-content: center; align-items: center; flex-direction: column; }
        .modal-img img { max-width: 90%; max-height: 75vh; border-radius: 12px; border: 2px solid var(--gold); }
        .modal-img h3 { color: var(--gold); font-family: 'Bodoni Moda', serif; margin: 20px 0 5px; font-size: 1.4rem; }
        .modal-img .stars-big { font-size: 1.6rem; color: var(--gold); margin-bottom: 10px; }

        /* MODAL COMMENTAIRE */
        .modal-note { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 4000; justify-content: center; align-items: center; }
        .modal-note-content {
            background: #0d0d0d; border: 1.5px solid var(--gold); border-radius: 15px;
            width: 88%; max-width: 420px; padding: 25px; text-align: left;
        }
        .modal-note-content h3 { font-family: 'Bodoni Moda', serif; color: var(--gold); margin: 0 0 15px; font-size: 1.1rem; }
        .note-texte {
            color: #ddd; font-size: 1rem; line-height: 1.7; font-style: italic;
            border-left: 2px solid var(--gold); padding-left: 15px; min-height: 60px;
        }
        .note-texte.empty { color: #555; font-style: normal; border-left-color: #333; }
        .btn-fermer-note {
            margin-top: 20px; width: 100%; padding: 13px; border-radius: 10px;
            background: none; border: 1px solid #333; color: #888;
            font-family: 'Montserrat', sans-serif; font-size: 0.9rem; font-weight: 700;
            text-transform: uppercase; cursor: pointer;
        }

        /* CARTES */
        .card { background: #0d0d0d; border: 1px solid var(--brd); padding: 15px; display: flex; width: 98%; max-width: 600px; text-align: left; margin-bottom: 12px; border-radius: 12px; align-items: center; box-sizing: border-box; }
        .img-vin { width: 70px; height: 100px; object-fit: cover; border-radius: 6px; border: 1.5px solid var(--gold); margin-right: 15px; flex-shrink: 0; cursor: pointer; }
        .vin-info { flex: 1; min-width: 0; }
        .vin-info b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .vin-qte { font-size: 1.5rem; font-weight: 700; color: #fff; margin-left: 8px; flex-shrink: 0; }
        .btn-carnet { background: none; border: 1px solid rgba(197,160,89,0.4); color: var(--gold); border-radius: 8px; padding: 6px 11px; font-size: 1.1rem; cursor: pointer; margin-left: 8px; flex-shrink: 0; }

        .readonly-badge { background: rgba(197,160,89,0.12); border: 1px solid rgba(197,160,89,0.4); color: var(--gold); font-size: 0.75rem; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }

        .btn-add { position: fixed; bottom: 30px; right: 20px; background: var(--gold); width: 65px; height: 65px; border-radius: 50%; border: none; font-size: 35px; color: #000; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input, textarea { width: 95%; padding: 15px; margin: 8px 0; background: #111; color: #fff; border: 1.5px solid var(--brd); border-radius: 10px; font-family: 'Montserrat'; box-sizing: border-box; }
        .stars { font-size: 35px; color: #333; margin: 15px 0; cursor: pointer; }
        .stars .selected { color: var(--gold); }
    </style>
</head>
<body>

    <!-- MODAL QR CODE -->
    <div id="qrModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="color:var(--gold); font-family:'Bodoni Moda';">PARTAGER MA CAVE</h2>
            <p style="color:#999; font-size:0.85rem; margin-top:-5px;">Scannez pour accéder à ma cave</p>
            <div class="qr-wrapper">
                <img src="https://i49.servimg.com/u/f49/11/31/89/70/mon" alt="QR Code">
            </div>
            <button class="btn-gold" style="min-height:50px; justify-content:center; margin:10px auto 0;" onclick="document.getElementById('qrModal').style.display='none'">FERMER</button>
        </div>
    </div>

    <!-- MODAL IMAGE GRANDE -->
    <div id="modalImg" class="modal-img" onclick="this.style.display='none'">
        <img id="modalImgSrc" src="" alt="">
        <h3 id="modalImgNom"></h3>
        <div class="stars-big" id="modalImgStars"></div>
    </div>

    <!-- MODAL COMMENTAIRE -->
    <div id="modalNote" class="modal-note" onclick="this.style.display='none'">
        <div class="modal-note-content" onclick="event.stopPropagation()">
            <h3 id="modalNoteNom"></h3>
            <div class="note-texte" id="modalNoteTexte"></div>
            <button class="btn-fermer-note" onclick="document.getElementById('modalNote').style.display='none'">FERMER</button>
        </div>
    </div>

    <!-- PAGE AUTH -->
    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Le Carnet de la Grappe</h1>
        <div class="intro-text">
            <b>Votre cave, toujours dans votre poche</b>
            <span>Inventorier vos crus, suivez vos stocks et vos notes de dégustation en un clin d'œil.</span>
        </div>
        <button id="googleLogin" class="btn-gold" style="background:white; color:black; border:none; justify-content:center; min-height:60px;">CONNEXION GOOGLE</button>
    </div>

    <!-- PAGE HOME -->
    <div id="PAGE_HOME" class="p">
        <h1 id="userName" style="font-family:'Bodoni Moda'; margin-bottom:30px;">Ma Cave</h1>
        <button class="btn-gold" onclick="openRayon('ROUGES')">
            <span>VINS ROUGES</span>
            <svg viewBox="0 0 100 100"><path d="M48 5V22M44 22H56V5C56 3 55 2 52 2C49 2 48 3 48 5V22Z" fill="#310a0a" stroke="#600d0d"/><path d="M43 22C35 25 32 32 32 40V88C32 91 35 94 38 94H62C65 94 68 91 68 88V40C68 32 65 25 57 22H43Z" fill="#7a0d0d" stroke="#600d0d" stroke-width="1.5"/></svg>
        </button>
        <button class="btn-gold" onclick="openRayon('BLANCS')">
            <span>VINS BLANCS</span>
            <svg viewBox="0 0 100 100"><path d="M48 5V22M44 22H56V5C56 3 55 2 52 2C49 2 48 3 48 5V22Z" fill="#444" stroke="#333"/><path d="M43 22C33 26 31 35 31 45V88C31 91 34 94 38 94H62C66 94 69 91 69 88V45C69 35 67 26 57 22H43Z" fill="#fff9e6" stroke="#d4b45d" stroke-width="1.5"/></svg>
        </button>
        <button class="btn-gold" onclick="openRayon('ROSES')">
            <span>VINS ROSÉS</span>
            <svg viewBox="0 0 100 100"><path d="M48 5V22M44 22H56V5C56 3 55 2 52 2C49 2 48 3 48 5V22Z" fill="#444" stroke="#222"/><path d="M43 22C35 25 32 32 32 40V88C32 91 35 94 38 94H62C65 94 68 91 68 88V40C68 32 65 25 57 22H43Z" fill="#ffe3e3" stroke="#ffb3b3" stroke-width="1.5"/></svg>
        </button>
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">
            <span>CHAMPAGNES</span>
            <svg viewBox="0 0 100 100"><path d="M42 5V18H58V5C58 4 57 3 53 3H47C43 3 42 4 42 5V18Z" fill="#c5a059"/><path d="M42 20C32 25 29 35 29 45V88C29 91 32 94 36 94H64C68 94 71 91 71 88V45C71 35 68 25 58 20H42Z" fill="#151515" stroke="#c5a059" stroke-width="2"/></svg>
        </button>
        <button onclick="document.getElementById('qrModal').style.display='flex'" style="background:none; border:1.5px solid #444; color:#888; padding:12px 25px; border-radius:8px; margin-top:35px; cursor:pointer; text-transform:uppercase; font-size:0.85rem; display:flex; align-items:center; gap:10px; margin-left:auto; margin-right:auto;">🔗 Mon QR Code</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="color:#666; background:none; border:none; margin-top:30px; text-decoration:underline; font-size:0.9rem; cursor:pointer;">Déconnexion</button>
    </div>

    <!-- PAGE LISTE -->
    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle"></h1>
        <div id="readonly-badge-container"></div>
        <div id="container-vins" style="width:100%"></div>
        <button id="btn-add-vin" class="btn-add" onclick="goToAdd()">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:30px; font-weight:700; cursor:pointer;">← RETOUR ACCUEIL</button>
    </div>

    <!-- PAGE ADD -->
    <div id="PAGE_ADD" class="p">
        <h1 id="addTitle">Ajouter</h1>
        <input type="text" id="nomVin" placeholder="Nom du vin">
        <input type="number" id="qteVin" placeholder="Quantité" value="1">
        <button class="btn-gold" onclick="document.getElementById('fileInput').click()" style="justify-content:center; border-style:dashed; min-height:60px;">📷 PHOTO</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)">
        <div id="preview"></div>
        <div class="stars" id="starRating">
            <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
        </div>
        <textarea id="noteVin" rows="4" placeholder="Notes de dégustation..."></textarea>
        <button class="btn-gold" style="background:var(--gold); color:#000; justify-content:center;" onclick="sauvegarderVin()">ENREGISTRER</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none; margin-top:10px;">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyABRweq9NpgFHy9tWpN8UhD0nBdTmZ-7dU",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();

        let userUID = null, rayonActuel = "", noteEtoiles = 0, currentImg = "", editID = null;
        let isReadOnly = false;

        const urlParams = new URLSearchParams(window.location.search);
        const viewUID = urlParams.get('view');

        if (viewUID) {
            isReadOnly = true;
            userUID = viewUID;
            document.getElementById('btn-add-vin').style.display = 'none';
            showPage('PAGE_HOME');
            document.getElementById('userName').innerText = "Cave partagée";
            document.querySelector('[onclick*="signOut"]').style.display = 'none';
            document.querySelector('[onclick*="qrModal"]').style.display = 'none';
        } else {
            document.getElementById('googleLogin').onclick = () => {
                auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert(e.message));
            };
            auth.onAuthStateChanged(u => {
                if (u) {
                    userUID = u.uid;
                    document.getElementById('userName').innerText = "Cave de " + u.displayName.split(' ')[0];
                    showPage('PAGE_HOME');
                } else {
                    showPage('PAGE_AUTH');
                }
            });
        }

        function showPage(id) {
            document.querySelectorAll('.p').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openRayon(n) {
            rayonActuel = n;
            document.getElementById('rayonTitle').innerText = n;
            document.getElementById('readonly-badge-container').innerHTML = isReadOnly ? '<div class="readonly-badge">👁 Mode consultation</div>' : '';
            if (!isReadOnly) document.getElementById('btn-add-vin').style.display = 'block';
            chargerVins();
            showPage('PAGE_LISTE');
        }

        function setStars(n) {
            noteEtoiles = n;
            document.querySelectorAll('#starRating span').forEach((s, i) => s.classList.toggle('selected', i < n));
        }

        function handleFile(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImg = e.target.result;
                document.getElementById('preview').innerHTML = `<img src="${currentImg}" style="width:100px; margin-top:15px; border-radius:8px;">`;
            };
            reader.readAsDataURL(input.files[0]);
        }

        function ouvrirImage(img, nom, etoiles) {
            document.getElementById('modalImgSrc').src = img;
            document.getElementById('modalImgNom').innerText = nom;
            document.getElementById('modalImgStars').innerText = '★'.repeat(etoiles) + '☆'.repeat(5 - etoiles);
            document.getElementById('modalImg').style.display = 'flex';
        }

        function ouvrirNote(nom, note) {
            document.getElementById('modalNoteNom').innerText = nom;
            const el = document.getElementById('modalNoteTexte');
            if (note && note.trim()) {
                el.innerText = note;
                el.classList.remove('empty');
            } else {
                el.innerText = 'Aucune note de dégustation.';
                el.classList.add('empty');
            }
            document.getElementById('modalNote').style.display = 'flex';
        }

        function chargerVins() {
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => {
                const c = document.getElementById('container-vins');
                c.innerHTML = "";
                let count = 0;
                s.forEach(child => {
                    const v = child.val(), id = child.key;
                    count++;
                    const etoiles = v.noteEtoiles || 0;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${v.image || 'https://via.placeholder.com/70x100'}" class="img-vin" title="Voir en grand">
                        <div class="vin-info">
                            <b>${v.nom}</b>
                            <span style="color:var(--gold); font-size:0.85rem;">${'★'.repeat(etoiles)}${'☆'.repeat(5-etoiles)}</span>
                        </div>
                        <div class="vin-qte">x${v.qte}</div>
                        <button class="btn-carnet" title="Commentaire">📖</button>
                        ${!isReadOnly ? `<button class="btn-suppr" style="background:none; border:none; color:#ff4444; font-size:1.5rem; margin-left:4px; cursor:pointer;">✕</button>` : ''}
                    `;
                    card.querySelector('.img-vin').onclick = () => ouvrirImage(v.image || 'https://via.placeholder.com/300x450', v.nom, etoiles);
                    card.querySelector('.btn-carnet').onclick = () => ouvrirNote(v.nom, v.note);
                    if (!isReadOnly) card.querySelector('.btn-suppr').onclick = () => supprimer(id);
                    c.appendChild(card);
                });
                if (count === 0) {
                    c.innerHTML = `<p style="color:#555; margin-top:40px;">${isReadOnly ? 'Aucun vin dans cette catégorie.' : 'Aucun vin. Ajoutez-en un !'}</p>`;
                }
            });
        }

        function goToAdd() {
            editID = null;
            document.getElementById('addTitle').innerText = "Ajouter";
            document.getElementById('nomVin').value = "";
            document.getElementById('qteVin').value = 1;
            document.getElementById('noteVin').value = "";
            document.getElementById('preview').innerHTML = "";
            currentImg = "";
            setStars(0);
            showPage('PAGE_ADD');
        }

        function supprimer(id) {
            if (confirm("Supprimer cette bouteille ?")) db.ref('users/' + userUID + '/cave/' + id).remove();
        }

        function sauvegarderVin() {
            const nom = document.getElementById('nomVin').value.trim();
            if (!nom) return alert("Veuillez entrer un nom.");
            const data = {
                nom,
                qte: parseInt(document.getElementById('qteVin').value) || 1,
                note: document.getElementById('noteVin').value,
                noteEtoiles,
                image: currentImg,
                categorie: rayonActuel
            };
            if (editID) {
                db.ref('users/' + userUID + '/cave/' + editID).update(data).then(() => showPage('PAGE_LISTE'));
            } else {
                db.ref('users/' + userUID + '/cave').push(data).then(() => showPage('PAGE_LISTE'));
            }
        }
    </script>
</body>
</html>
