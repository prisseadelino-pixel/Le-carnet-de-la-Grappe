    <h1 id="userName" style="font-family:'Bodoni Moda';">Ma Cave</h1>
    
    <button class="btn-gold" onclick="openRayon('ROUGES')">
        <span>ROUGES</span>
        <img src="https://i.servimg.com/u/f49/11/31/89/70/rouge11.png" class="img-button">
