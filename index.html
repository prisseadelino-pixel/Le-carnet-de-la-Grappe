<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@300;600&display=swap');
        :root { --gold: #c5a059; --bg: #000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        .logo { width: 120px; margin: 20px auto; border: 1px solid var(--gold); padding: 10px; border-radius: 5px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 1.6rem; margin: 10px 0; text-transform: uppercase; }
        .btn-gold { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 15px; width: 90%; max-width: 320px; margin: 10px 0; text-transform: uppercase; font-weight: bold; cursor: pointer; }
        .btn-add { position: fixed; bottom: 30px; right: 20px; background: var(--gold); width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 35px; color: #000; z-index: 100; }
        .card { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.1); padding: 15px; display: flex; width: 100%; max-width: 500px; text-align: left; margin-bottom: 10px; border-radius: 8px; align-items: center; position: relative; box-sizing: border-box; }
        .img-vin { width: 60px; height: 80px; object-fit: cover; background: #1a1a1a; margin-right: 15px; border-radius: 4px; cursor: pointer; }
        .actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 10px; }
        .edit-btn { color: var(--gold); font-size: 18px; cursor: pointer; }
        .delete-btn { color: #555; font-size: 18px; cursor: pointer; }
        input, textarea { width: 90%; padding: 12px; margin: 8px 0; background: #111; color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 5px; }
        .stars span { font-size: 35px; color: #333; cursor: pointer; transition: 0.2s; }
        .stars span.selected { color: var(--gold); }
        #photoModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; }
        #fullImg { max-width: 90%; max-height: 80%; border: 2px solid var(--gold); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="photoModal" onclick="this.style.display='none'">
        <img id="fullImg" src="">
    </div>

    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Authentification</h1>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mot de passe">
        <button class="btn-gold" onclick="login()">Se connecter</button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1>Ma Cave</h1>
        <button class="btn-gold" onclick="openRayon('ROUGES')">Vins Rouges</button>
        <button class="btn-gold" onclick="openRayon('BLANCS')">Vins Blancs</button>
        <button class="btn-gold" onclick="openRayon('ROSES')">Vins Rosés</button>
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">Champagnes</button>
        <button onclick="auth.signOut()" style="color:gray; background:none; border:none; margin-top:20px;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle">Rayon</h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="goToAdd()">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:20px;">← RETOUR</button>
    </div>

    <div id="PAGE_ADD" class="p">
        <h1 id="formTitle">Nouveau Vin</h1>
        <input type="text" id="nomVin" placeholder="Nom du Domaine">
        <input type="number" id="qteVin" placeholder="Quantité">
        <input type="text" id="imgVin" placeholder="Lien photo (URL)">
        <div class="stars" id="starRating">
            <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
        </div>
        <textarea id="noteVin" placeholder="Commentaires"></textarea>
        <button class="btn-gold" style="background:var(--gold); color:#000;" onclick="sauvegarderVin()">Valider</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none;">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let userUID, rayonActuel, noteEtoiles = 0, vinEnEditionId = null;

        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert("Erreur : " + err.message));
        }

        auth.onAuthStateChanged(user => {
            if (user) { userUID = user.uid; showPage('PAGE_HOME'); } else { showPage('PAGE_AUTH'); }
        });

        function showPage(id) {
            document.querySelectorAll('.p').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function setStars(n) {
            noteEtoiles = n;
            const spans = document.querySelectorAll('#starRating span');
            spans.forEach((s, i) => s.classList.toggle('selected', i < n));
        }

        function zoomPhoto(url) {
            if(!url) return;
            document.getElementById('fullImg').src = url;
            document.getElementById('photoModal').style.display = 'flex';
        }

        function openRayon(nom) {
            rayonActuel = nom;
            document.getElementById('rayonTitle').innerText = nom;
            db.ref('users/'+userUID+'/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', snap => {
                const container = document.getElementById('container-vins');
                container.innerHTML = "";
                if (!snap.val()) return;
                Object.entries(snap.val()).forEach(([id, v]) => {
                    let etoiles = "★".repeat(v.noteEtoiles || 0);
                    container.innerHTML += `
                        <div class="card">
                            <div class="actions">
                                <span class="edit-btn" onclick="modifierVin('${id}')">✎</span>
                                <span class="delete-btn" onclick="supprimerVin('${id}')">×</span>
                            </div>
                            <img src="${v.image || 'https://via.placeholder.com/60x80'}" class="img-vin" onclick="zoomPhoto('${v.image}')">
                            <div style="flex:1">
                                <b style="color:var(--gold);">${v.nom}</b><br>
                                <span style="color:var(--gold); font-size:12px;">${etoiles}</span>
                            </div>
                            <div style="font-weight:bold; color:var(--gold);">x${v.qte}</div>
                        </div>`;
                });
            });
            showPage('PAGE_LISTE');
        }

        function goToAdd() {
            vinEnEditionId = null;
            document.getElementById('formTitle').innerText = "Nouveau Vin";
            document.getElementById('nomVin').value = "";
            document.getElementById('qteVin').value = "1";
            document.getElementById('imgVin').value = "";
            document.getElementById('noteVin').value = "";
            setStars(0);
            showPage('PAGE_ADD');
        }

        function modifierVin(id) {
            db.ref('users/'+userUID+'/cave/'+id).once('value', snap => {
                const v = snap.val();
                vinEnEditionId = id;
                document.getElementById('formTitle').innerText = "Modifier le Vin";
                document.getElementById('nomVin').value = v.nom;
                document.getElementById('qteVin').value = v.qte;
                document.getElementById('imgVin').value = v.image || "";
                document.getElementById('noteVin').value = v.note || "";
                setStars(v.noteEtoiles || 0);
                showPage('PAGE_ADD');
            });
        }

        function sauvegarderVin() {
            const data = {
                nom: document.getElementById('nomVin').value,
                qte: document.getElementById('qteVin').value,
                image: document.getElementById('imgVin').value,
                noteEtoiles: noteEtoiles,
                note: document.getElementById('noteVin').value,
                categorie: rayonActuel
            };
            const ref = vinEnEditionId ? db.ref('users/'+userUID+'/cave/'+vinEnEditionId) : db.ref('users/'+userUID+'/cave').push();
            ref.set(data).then(() => showPage('PAGE_LISTE'));
        }

        function supprimerVin(id) { if(confirm("Supprimer ?")) db.ref('users/'+userUID+'/cave/'+id).remove(); }
    </script>
</body>
</html>
