<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@300;600&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.1); --card-bg: #0a0a0a; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        
        /* LOGO ET TITRES */
        .logo { width: 100px; height: auto; margin: 20px auto; border: 1px solid var(--gold); padding: 10px; border-radius: 5px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 1.4rem; margin: 10px 0; text-transform: uppercase; }
        .subtitle { letter-spacing: 3px; font-size: 0.7rem; color: var(--gold); text-transform: uppercase; margin-bottom: 30px; }
        
        /* BOUTONS */
        .btn-gold { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 15px; width: 90%; max-width: 300px; margin: 10px 0; text-transform: uppercase; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-gold:active { background: var(--gold); color: #000; }
        .btn-google { background: white; color: #000; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; margin: 20px auto; width: 90%; max-width: 300px; justify-content: center; }
        .btn-add { position: fixed; bottom: 30px; right: 20px; background: var(--gold); width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 35px; color: #000; box-shadow: 0 4px 15px rgba(197,160,89,0.4); z-index: 100; cursor: pointer; }
        
        /* CARTES DE VINS */
        .card { background: var(--card-bg); border: 1px solid var(--brd); padding: 15px; display: flex; width: 100%; max-width: 500px; text-align: left; margin-bottom: 10px; border-radius: 8px; align-items: center; position: relative; cursor: pointer; }
        .img-vin { width: 60px; height: 80px; object-fit: cover; background: #1a1a1a; margin-right: 15px; border-radius: 4px; border: 1px solid var(--brd); }
        .delete-btn { position: absolute; top: 10px; right: 10px; color: #ff4444; font-size: 20px; cursor: pointer; opacity: 0.5; padding: 5px; z-index: 10; }
        
        /* ÉTOILES */
        .stars span { font-size: 30px; color: #444; cursor: pointer; }
        .stars .selected { color: var(--gold); }
        
        /* ZOOM PHOTO ET MODAL DE MODIFICATION */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal { background: #111; border: 1px solid var(--gold); border-radius: 10px; padding: 20px; width: 90%; max-width: 400px; }
        #zoomImg { max-width: 90%; max-height: 80%; border: 2px solid var(--gold); border-radius: 8px; }

        input, textarea { width: 90%; padding: 12px; margin: 8px 0; background: #111; color: #fff; border: 1px solid var(--brd); border-radius: 5px; font-family: 'Montserrat', sans-serif; box-sizing: border-box; }
        #preview, #editPreview { width: 80px; height: 100px; object-fit: cover; margin: 10px; border: 1px solid var(--gold); display: none; }
    </style>
</head>
<body>

    <div id="zoomOverlay" class="overlay" onclick="this.style.display='none'"><img id="zoomImg" src=""></div>

    <div id="editModal" class="overlay">
        <div class="modal">
            <h1>Modifier le Vin</h1>
            <input type="text" id="editNomVin" placeholder="Nom">
            <input type="number" id="editQteVin" placeholder="Quantité">
            <label for="editCameraInput" class="btn-gold" style="display:inline-block; font-size: 0.8rem; padding:10px;">📸 Changer photo</label>
            <input type="file" id="editCameraInput" accept="image/*" capture="environment" style="display:none;" onchange="previewPhotoEdit(this)">
            <img id="editPreview" src="">
            <div class="stars" id="editStarRating">
                <span onclick="setStarsEdit(1)">★</span><span onclick="setStarsEdit(2)">★</span><span onclick="setStarsEdit(3)">★</span><span onclick="setStarsEdit(4)">★</span><span onclick="setStarsEdit(5)">★</span>
            </div>
            <textarea id="editNoteVin" placeholder="Commentaires..."></textarea>
            <button id="btnUpdate" class="btn-gold" style="background:var(--gold); color:#000;" onclick="mettreAJourVin()">Enregistrer les modifications</button>
            <button onclick="document.getElementById('editModal').style.display='none'" style="color:gray; background:none; border:none; margin-top:10px; cursor:pointer;">Annuler</button>
        </div>
    </div>

    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Le Carnet</h1>
        <div class="subtitle">Votre cave numérique</div>
        <button class="btn-google" onclick="login()">Se connecter avec Google</button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        <button class="btn-gold" onclick="openRayon('ROUGES')">Vins Rouges</button>
        <button class="btn-gold" onclick="openRayon('BLANCS')">Vins Blancs</button>
        <button class="btn-gold" onclick="openRayon('ROSES')">Vins Rosés</button>
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">Champagnes</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="color:gray; background:none; border:none; margin-top:30px;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle">Rayon</h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="showPage('PAGE_ADD')">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:20px;">← MENU</button>
    </div>

    <div id="PAGE_ADD" class="p">
        <h1>Nouveau Vin</h1>
        <input type="text" id="nomVin" placeholder="Nom du Domaine / Cuvée">
        <input type="number" id="qteVin" placeholder="Quantité" value="1">
        <label for="cameraInput" class="btn-gold" style="display:inline-block; font-size: 0.8rem;">📸 Prendre une photo</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="previewPhotoAdd(this)">
        <img id="preview" src="">
        <div class="stars" id="addStarRating">
            <span onclick="setStarsAdd(1)">★</span><span onclick="setStarsAdd(2)">★</span><span onclick="setStarsAdd(3)">★</span><span onclick="setStarsAdd(4)">★</span><span onclick="setStarsAdd(5)">★</span>
        </div>
        <textarea id="noteVin" placeholder="Notes perso..."></textarea>
        <button id="btnSave" class="btn-gold" style="background:var(--gold); color:#000;" onclick="sauvegarderVin()">Enregistrer dans ma cave</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none; margin-top:10px;">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID = null, rayonActuel = "", addStars=0, editStars=0, base64Add="", base64Edit="", vinIdAModifier=null;

        function login() { const p = new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p).catch(() => auth.signInWithRedirect(p)); }
        auth.onAuthStateChanged(u => { if(u) { userUID=u.uid; document.getElementById('userName').innerText = "Cave de "+u.displayName; showPage('PAGE_HOME'); } else { showPage('PAGE_AUTH'); }});
        function showPage(id) { document.querySelectorAll('.p').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function setStarsAdd(n) { addStars=n; document.querySelectorAll('#addStarRating span').forEach((s,i)=>s.classList.toggle('selected',i<n)); }
        function setStarsEdit(n) { editStars=n; document.querySelectorAll('#editStarRating span').forEach((s,i)=>s.classList.toggle('selected',i<n)); }

        function handlePhoto(input, targetBase64, targetPreview) {
            if (input.files && input.files[0]) {
                const reader = new FileReader(); reader.readAsDataURL(input.files[0]);
                reader.onload = (e) => {
                    const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d"), img = new Image();
                    img.src = e.target.result; img.onload = () => {
                        const maxW=500, ratio=img.width/img.height;
                        canvas.width = maxW; canvas.height = maxW/ratio;
                        ctx.drawImage(img,0,0,canvas.width,canvas.height);
                        const b64 = canvas.toDataURL("image/jpeg", 0.7);
                        if(targetBase64==='add') base64Add=b64; else base64Edit=b64;
                        document.getElementById(targetPreview).src=b64; document.getElementById(targetPreview).style.display='block';
                    }
                }
            }
        }
        function previewPhotoAdd(input){handlePhoto(input,'add','preview');}
        function previewPhotoEdit(input){handlePhoto(input,'edit','editPreview');}

        function openRayon(n) { rayonActuel=n; document.getElementById('rayonTitle').innerText=n; showPage('PAGE_LISTE'); chargerVins(); }
        
        function chargerVins() {
            const c = document.getElementById('container-vins');
            db.ref('users/'+userUID+'/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => {
                c.innerHTML = ""; const data=s.val(); if(!data) { c.innerHTML="<p>Aucun vin.</p>"; return; }
                Object.entries(data).forEach(([id, v]) => {
                    let st="★".repeat(v.noteEtoiles||0)+"☆".repeat(5-(v.noteEtoiles||0));
                    c.innerHTML += `<div class="card" onclick="ouvrirModalModification('${id}', '${v.nom.replace(/'/g, "\\'")}', '${v.qte}', '${v.noteEtoiles}', '${v.note.replace(/'/g, "\\'")}', '${v.image}')"><span class="delete-btn" onclick="supprimerVin(event, '${id}')">×</span><img src="${v.image || 'https://via.placeholder.com/50x70?text=Vin'}" class="img-vin" onclick="zoomImage(event, this.src)"><div style="flex:1"><b>${v.nom}</b><br><span style="color:var(--gold);">${st}</span><br><small style="color:#aaa;">${v.note || ''}</small></div><div style="font-weight:bold; color:var(--gold); font-size:1.1rem; margin-left:10px;">x${v.qte}</div></div>`;
                });
            });
        }

        function zoomImage(e, url) { e.stopPropagation(); document.getElementById('zoomImg').src=url; document.getElementById('zoomOverlay').style.display='flex'; }

        function sauvegarderVin() {
            const n=document.getElementById('nomVin').value; if(!n) return alert("Nom requis");
            document.getElementById('btnSave').innerText="Enregistrement...";
            db.ref('users/'+userUID+'/cave').push({nom:n, qte:document.getElementById('qteVin').value, image:base64Add, noteEtoiles:addStars, note:document.getElementById('noteVin').value, categorie:rayonActuel
            }).then(() => {
                document.getElementById('btnSave').innerText="Enregistrer";
                document.getElementById('nomVin').value=''; document.getElementById('qteVin').value='1'; document.getElementById('noteVin').value='';
                base64Add=""; document.getElementById('preview').style.display='none'; setStarsAdd(0); showPage('PAGE_LISTE');
            });
        }

        function supprimerVin(e, id) { e.stopPropagation(); if(confirm("Supprimer ce vin ?")) { db.ref('users/'+userUID+'/cave/'+id).remove(); } }

        function ouvrirModalModification(id, nom, qte, noteEtoiles, note, image) {
            vinIdAModifier = id;
            document.getElementById('editNomVin').value = nom;
            document.getElementById('editQteVin').value = qte;
            document.getElementById('editNoteVin').value = note;
            base64Edit = image;
            if(image !== "undefined" && image !== "null" && image !== "") { document.getElementById('editPreview').src=image; document.getElementById('editPreview').style.display='block'; } else { document.getElementById('editPreview').style.display='none'; }
            setStarsEdit(parseInt(noteEtoiles));
            document.getElementById('editModal').style.display = 'flex';
        }

        function mettreAJourVin() {
            const n=document.getElementById('editNomVin').value; if(!n) return alert("Nom requis");
            document.getElementById('btnUpdate').innerText="Modification en cours...";
            db.ref('users/'+userUID+'/cave/'+vinIdAModifier).update({nom:n, qte:document.getElementById('editQteVin').value, image:base64Edit, noteEtoiles:editStars, note:document.getElementById('editNoteVin').value
            }).then(() => {
                document.getElementById('btnUpdate').innerText="Enregistrer les modifications";
                document.getElementById('editModal').style.display='none';
            });
        }
    </script>
</body>
</html>
