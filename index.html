<style>
    /* ... (style précédent inchangé jusqu'à .btn-gold) ... */

    .btn-gold { 
        background: rgba(197,160,89,0.05); 
        border: 2px solid var(--gold); 
        color: var(--gold); 
        padding: 12px 25px; /* Augmentation du padding interne */
        width: 95%; 
        max-width: 500px; 
        margin: 15px 0; 
        text-transform: uppercase; 
        cursor: pointer; 
        font-weight: 700; 
        font-size: 1.2rem; 
        border-radius: 15px; 
        display: flex; 
        align-items: center; 
        justify-content: flex-start; 
        box-sizing: border-box; 
        transition: all 0.3s; 
    }

    .btn-gold:active { background: rgba(197,160,89,0.2); transform: scale(0.98); }

    /* Modification des dimensions des icônes SVG pour plus de largeur */
    .btn-gold svg { 
        height: 65px; 
        width: 45px; /* Largeur fixée pour donner du corps à l'icône */
        margin-right: 20px; 
        filter: drop-shadow(0 0 8px rgba(0,0,0,0.6)); 
    }
</style>
