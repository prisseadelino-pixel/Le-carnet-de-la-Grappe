<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Carnet de la Grappe - Connexion</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
        }

        #auth-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 350px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 10px;
            background: #8c1c13;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover {
            background: #a32018;
        }

        #error {
            margin-top: 10px;
            color: red;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>

<body>

    <h1>Le Carnet de la Grappe</h1>

    <div id="auth-container">
        <h2>Connexion</h2>

        <input type="email" id="email" placeholder="Adresse email">
        <input type="password" id="password" placeholder="Mot de passe">

        <button onclick="login()">Se connecter</button>
        <button onclick="signup()">Créer un compte</button>

        <p id="error"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCokyRytC3xKKLhT6nmJtFQ4kNfJCQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            storageBucket: "le-carnet-de-la-grappe.appspot.com",
            messagingSenderId: "901225339402",
            appId: "1:901225339402:web:2B8F87d75174087c29c6c97"
        };

        firebase.initializeApp(firebaseConfig);

        function login() {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;

            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(() => {
                    window.location.href = "app.html";
                })
                .catch(err => {
                    document.getElementById("error").innerText = err.message;
                });
        }

        function signup() {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;

            firebase.auth().createUserWithEmailAndPassword(email, pass)
                .then(() => {
                    window.location.href = "app.html";
                })
                .catch(err => {
                    document.getElementById("error").innerText = err.message;
                });
        }
    </script>

</body>
</html>
