<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;700&display=swap');
        
        :root { --gold: #c5a059; --bg: #000; }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            justify-content: center;
        }

        .p { display: none; flex-direction: column; align-items: center; padding: 40px 20px; width: 100%; max-width: 500px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }

        /* HEADER & LOGO */
        .logo-container { border: 1px solid var(--gold); padding: 5px; margin-bottom: 50px; }
        .logo-main { width: 120px; display: block; }
        
        h1 { 
            font-family: 'Bodoni Moda', serif; 
            color: var(--gold); 
            font-size: 1.8rem; 
            letter-spacing: 3px; 
            margin-bottom: 50px; 
            text-transform: uppercase;
            line-height: 1.2;
        }

        /* TEXT BOX (COPIE CONFORME) */
        .info-box {
            background: rgba(197, 160, 89, 0.03);
            border-left: 2px solid var(--gold);
            padding: 25px;
            text-align: left;
            margin-bottom: 60px;
            max-width: 380px;
        }
        .info-box p {
            margin: 0;
            line-height: 1.6;
            font-size: 0.95rem;
            color: #d1d1d1;
        }
        .info-box b { color: var(--gold); }

        /* BOUTON GOOGLE */
        .btn-google {
            background: #fff;
            color: #000;
            border: none;
            padding: 18px;
            width: 100%;
            max-width: 380px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-google img { width: 22px; margin-right: 15px; }

        /* ACCUEIL ET QR */
        .btn-menu { background: none; border: 2px solid var(--gold); color: var(--gold); padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; margin: 10px 0; }
        #QR_MODAL { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .qr-card { background: #fff; padding: 20px; border-radius: 20px; border: 5px solid var(--gold); position: relative; }
        .qr-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -110%); width: 45px; height: 45px; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- AUTHENTIFICATION -->
    <div id="PAGE_AUTH" class="p active">
        <div class="logo-container">
            <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo-main">
        </div>
        
        <h1>LE CARNET DE LA GRAPPE</h1>
        
        <div class="info-box">
            <p><b>Votre cave, toujours dans votre poche.</b><br>
            Cet assistant numérique vous permet d'<b>inventorier</b> vos précieux crus, de suivre l'état de vos <b>stocks</b> en temps réel et de consigner vos <b>notes de dégustation</b> accompagnées de photos. Simple, privé et élégant.</p>
        </div>

        <button class="btn-google" id="btnConnect">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png">
            Connexion Google
        </button>
    </div>

    <!-- ACCUEIL -->
    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        <button class="btn-menu" onclick="toggleQR()">MON ACCÈS QR</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="color:#666; background:none; border:none; margin-top:50px; font-weight: bold; cursor:pointer;">DÉCONNEXION</button>
    </div>

    <!-- MODAL QR -->
    <div id="QR_MODAL" onclick="toggleQR()">
        <div class="qr-card" onclick="event.stopPropagation()">
            <div id="qrcode"></div>
            <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="qr-overlay">
            <button onclick="toggleQR()" style="background:var(--gold); border:none; color:#fff; width:100%; padding:12px; margin-top:15px; border-radius:8px; font-weight:bold;">FERMER</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8", 
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com", 
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app", 
            projectId: "le-carnet-de-la-grappe", 
            appId: "1:90122533942:web:0448a69951e95108ce6c97" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Connexion
        document.getElementById('btnConnect').onclick = () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithRedirect(provider).catch(e => alert("Erreur : " + e.message));
        };

        // Gestion d'état
        auth.onAuthStateChanged(user => { 
            if(user) { 
                document.getElementById('userName').innerText = "CAVE DE " + user.displayName.toUpperCase().split(' ')[0];
                genererQR(user.uid);
                showPage('PAGE_HOME'); 
            } else { 
                showPage('PAGE_AUTH'); 
            }
        });

        function genererQR(uid) {
            const container = document.getElementById('qrcode');
            container.innerHTML = "";
            new QRCode(container, {
                text: "https://le-carnet-de-la-grappe.web.app/?user=" + uid,
                width: 220,
                height: 220,
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function toggleQR() {
            const m = document.getElementById('QR_MODAL');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function showPage(id) { 
            document.querySelectorAll('.p').forEach(p => p.classList.remove('active')); 
            document.getElementById(id).classList.add('active'); 
        }
    </script>
</body>
</html>
