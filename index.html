<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;700&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.15); }
        
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; overflow-x: hidden; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 2rem; margin: 15px 0; text-transform: uppercase; letter-spacing: 2px; }

        /* BOUTONS HOME RÉPARÉS */
        .btn-gold { 
            background: rgba(197,160,89,0.05); 
            border: 2px solid var(--gold); 
            color: var(--gold); 
            padding: 10px 20px; 
            width: 95%; 
            max-width: 500px; 
            margin: 12px 0; 
            text-transform: uppercase; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 1.2rem; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            box-sizing: border-box;
            transition: 0.3s;
        }
        
        .btn-gold:active { background: rgba(197,160,89,0.15); }

        /* Style spécifique pour les bouteilles SVG */
        .btn-gold svg { 
            height: 70px; /* Plus grand */
            width: 50px;  /* Plus large */
            margin-right: 20px;
            display: block;
            background: transparent; /* Force la transparence */
        }

        /* Styles restants (Cards, inputs, etc.) */
        .card { background: #0d0d0d; border: 1px solid var(--brd); padding: 15px; display: flex; width: 98%; max-width: 600px; text-align: left; margin-bottom: 12px; border-radius: 12px; align-items: center; box-sizing: border-box; }
        .img-vin { width: 70px; height: 100px; object-fit: cover; background: #1a1a1a; margin-right: 15px; border-radius: 6px; border: 1.5px solid var(--gold); }
        .vin-info { flex: 1; }
        .vin-info b { font-size: 1.3rem; display: block; margin-bottom: 5px; color: var(--gold); }
        .vin-qte { font-size: 1.5rem; font-weight: 700; color: #fff; }
        .btn-add { position: fixed; bottom: 30px; right: 20px; background: var(--gold); width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 40px; color: #000; box-shadow: 0 4px 20px rgba(197,160,89,0.5); z-index: 100; font-weight: bold; cursor: pointer; }
        .btn-qr { background: none; border: 1px solid gray; color: gray; padding: 8px; border-radius: 5px; margin-top: 15px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="PAGE_AUTH" class="p active">
        <h1 style="margin-top: 50px;">Le Carnet de la Grappe</h1>
        <button class="btn-gold" id="googleLogin" style="justify-content: center; background: white; color: black; border: none;">CONNEXION GOOGLE</button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        
        <button class="btn-gold" onclick="openRayon('ROUGES')">
            <svg viewBox="0 0 40 90">
                <path d="M20 5V15M17 15H23V5C23 3 22 2 20 2C18 2 17 3 17 5V15Z" fill="#331111"/>
                <path d="M12 15C8 18 6 22 6 28V82C6 86 9 89 13 89H27C31 89 34 86 34 82V28C34 22 32 18 28 15H12Z" fill="#660000" stroke="#440000"/>
                <rect x="10" y="40" width="20" height="22" fill="#220000" opacity="0.6"/>
                <path d="M18 22V82C18 82 28 75 28 65V35C28 25 18 22 18 22Z" fill="white" opacity="0.1"/>
            </svg>
            VINS ROUGES
        </button>

        <button class="btn-gold" onclick="openRayon('BLANCS')">
            <svg viewBox="0 0 40 90">
                <path d="M17 15H23V5C23 3 22 2 20 2C18 2 17 3 17 5V15Z" fill="#555"/>
                <path d="M12 15C8 18 6 22 6 28V82C6 86 9 89 13 89H27C31 89 34 86 34 82V28C34 22 32 18 28 15H12Z" fill="#FFFBEB" stroke="#E6C96C"/>
                <rect x="10" y="40" width="20" height="22" fill="#E6C96C" opacity="0.3"/>
                <path d="M18 22V82C18 82 28 75 28 65V35C28 25 18 22 18 22Z" fill="white" opacity="0.5"/>
            </svg>
            VINS BLANCS
        </button>

        <button class="btn-gold" onclick="openRayon('ROSES')">
            <svg viewBox="0 0 40 90">
                <path d="M17 15H23V5C23 3 22 2 20 2C18 2 17 3 17 5V15Z" fill="#555"/>
                <path d="M12 15C8 18 6 22 6 28V82C6 86 9 89 13 89H27C31 89 34 86 34 82V28C34 22 32 18 28 15H12Z" fill="#FFE4E1" stroke="#FFA07A"/>
                <rect x="10" y="40" width="20" height="22" fill="#FFA07A" opacity="0.3"/>
            </svg>
            VINS ROSÉS
        </button>

        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">
            <svg viewBox="0 0 40 90">
                <path d="M16 15H24V6C24 3 22 2 20 2C18 2 16 3 16 6V15Z" fill="#C5A059"/>
                <path d="M12 15C8 18 7 23 7 29V82C7 86 10 89 14 89H26C30 89 33 86 33 82V29C33 23 32 18 28 15H12Z" fill="#1A1A1A" stroke="#C5A059"/>
                <rect x="12" y="42" width="16" height="20" fill="#C5A059" opacity="0.8"/>
            </svg>
            CHAMPAGNES
        </button>

        <button class="btn-qr" onclick="showQR()">🔗 MON QR CODE</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="color:gray; background:none; border:none; margin-top:30px; text-decoration:underline;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle"></h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="goToAdd()">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:30px; font-weight:700;">← RETOUR</button>
    </div>

    <script>
        // Configuration Firebase (Garde la tienne ici)
        const firebaseConfig = {
            apiKey: "AIzaSyABRweq9NpgFHy9tWpN8UhD0nBdTmZ-7dU",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID = null, rayonActuel = "";

        auth.onAuthStateChanged(u => {
            if(u) { userUID = u.uid; document.getElementById('userName').innerText = "Cave de " + u.displayName.split(' ')[0]; showPage('PAGE_HOME'); } 
            else { showPage('PAGE_AUTH'); }
        });

        function showPage(id) { document.querySelectorAll('.p').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function openRayon(n) { rayonActuel = n; document.getElementById('rayonTitle').innerText = n; chargerVins(); showPage('PAGE_LISTE'); }

        function chargerVins() {
            const c = document.getElementById('container-vins');
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => {
                c.innerHTML = "";
                if(!s.exists()) { c.innerHTML = "<p>Rayon vide.</p>"; return; }
                s.forEach(child => {
                    const v = child.val();
                    c.innerHTML += `
                        <div class="card">
                            <img src="${v.image || 'https://via.placeholder.com/150'}" class="img-vin">
                            <div class="vin-info"><b>${v.nom}</b></div>
                            <div class="vin-qte">x${v.qte}</div>
                        </div>`;
                });
            });
        }
    </script>
</body>
</html>
