<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;700&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.15); }
        
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; }
        
        /* Conteneur principal plus large */
        .p { display: none; flex-direction: column; align-items: center; padding: 30px 15px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        
        .logo { width: 140px; height: auto; margin-bottom: 20px; border: 1.5px solid var(--gold); padding: 10px; border-radius: 8px; }
        
        /* Titres plus imposants */
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 2.2rem; margin: 20px 0; text-transform: uppercase; letter-spacing: 3px; }
        
        /* Boutons du menu agrandis */
        .btn-gold { 
            background: rgba(197,160,89,0.05); 
            border: 1.5px solid var(--gold); 
            color: var(--gold); 
            padding: 22px; 
            width: 95%; 
            max-width: 450px; 
            margin: 12px 0; 
            text-transform: uppercase; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 1.1rem; 
            border-radius: 8px; 
            letter-spacing: 1px;
        }

        /* Bouton Google plus large */
        .btn-google { 
            background: white; 
            color: #000; 
            border: none; 
            padding: 20px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 1.1rem;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-top: 40px; 
            width: 95%; 
            max-width: 450px; 
            justify-content: center; 
        }

        /* Fiches vins (Cards) agrandies */
        .card { 
            background: #0d0d0d; 
            border: 1px solid var(--brd); 
            padding: 20px; 
            display: flex; 
            width: 95%; 
            max-width: 600px; 
            text-align: left; 
            margin-bottom: 15px; 
            border-radius: 12px; 
            align-items: center; 
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .img-vin { width: 80px; height: 110px; object-fit: cover; background: #1a1a1a; margin-right: 20px; border-radius: 6px; border: 1px solid var(--gold); }
        
        .vin-info b { font-size: 1.4rem; display: block; margin-bottom: 5px; }
        .vin-qte { font-size: 1.6rem; font-weight: 700; color: #fff; margin-left: auto; padding-right: 15px; }

        .btn-add { position: fixed; bottom: 40px; right: 25px; background: var(--gold); width: 75px; height: 75px; border-radius: 50%; border: none; font-size: 45px; color: #000; box-shadow: 0 6px 20px rgba(197,160,89,0.5); z-index: 100; font-weight: bold; }
        
        .stars { font-size: 45px; color: #333; margin: 20px 0; }
        .stars .selected { color: var(--gold); }
        
        input, textarea { 
            width: 95%; 
            max-width: 450px; 
            padding: 18px; 
            margin: 12px 0; 
            background: #111; 
            color: #fff; 
            border: 1.5px solid var(--brd); 
            border-radius: 8px; 
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        #zoomOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        #zoomImg { max-width: 90%; max-height: 85%; border: 2px solid var(--gold); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="zoomOverlay" onclick="this.style.display='none'"><img id="zoomImg" src=""></div>
    
    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Mon Carnet</h1>
        <button class="btn-google" id="googleLogin">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="25">
            SE CONNECTER AVEC GOOGLE
        </button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        <button class="btn-gold" onclick="openRayon('ROUGES')">🍷 VINS ROUGES</button>
        <button class="btn-gold" onclick="openRayon('BLANCS')">🥂 VINS BLANCS</button>
        <button class="btn-gold" onclick="openRayon('ROSES')">🌸 VINS ROSÉS</button>
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">🍾 CHAMPAGNES</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="color:gray; background:none; border:none; margin-top:40px; font-size:1rem; cursor:pointer; text-decoration: underline;">Se déconnecter</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle"></h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="goToAdd()">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:30px; font-size:1.2rem; font-weight:700;">← RETOUR</button>
    </div>

    <div id="PAGE_ADD" class="p">
        <h1>Nouveau Vin</h1>
        <input type="text" id="nomVin" placeholder="Nom du vin">
        <input type="number" id="qteVin" placeholder="Quantité" value="1">
        <input type="text" id="imgVin" placeholder="Lien photo (URL)">
        <div class="stars" id="starRating">
            <span onclick="setStars(1)">★</span><span onclick="setStars(2)">★</span><span onclick="setStars(3)">★</span><span onclick="setStars(4)">★</span><span onclick="setStars(5)">★</span>
        </div>
        <textarea id="noteVin" rows="4" placeholder="Notes de dégustation..."></textarea>
        <button class="btn-gold" style="background:var(--gold); color:#000;" onclick="sauvegarderVin()">Enregistrer</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none; margin-top:15px; font-size:1.1rem;">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID = null, rayonActuel = "", noteEtoiles = 0;

        document.getElementById('googleLogin').onclick = () => {
            const p = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(p).catch(() => auth.signInWithRedirect(p));
        };

        auth.onAuthStateChanged(u => {
            if(u) { userUID = u.uid; document.getElementById('userName').innerText = "Cave de " + u.displayName.split(' ')[0]; showPage('PAGE_HOME'); } 
            else { showPage('PAGE_AUTH'); }
        });

        function showPage(id) {
            document.querySelectorAll('.p').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        function setStars(n) {
            noteEtoiles = n;
            document.querySelectorAll('#starRating span').forEach((s, i) => s.classList.toggle('selected', i < n));
        }

        function openRayon(n) { rayonActuel = n; document.getElementById('rayonTitle').innerText = n; chargerVins(); showPage('PAGE_LISTE'); }

        function chargerVins() {
            const c = document.getElementById('container-vins');
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => {
                c.innerHTML = "";
                if(!s.exists()) { c.innerHTML = "<p style='margin-top:30px; font-size:1.2rem; color:gray;'>Aucune bouteille ici.</p>"; return; }
                s.forEach(child => {
                    const v = child.val(), id = child.key;
                    let st = "★".repeat(v.noteEtoiles || 0) + "☆".repeat(5 - (v.noteEtoiles || 0));
                    c.innerHTML += `
                        <div class="card">
                            <img src="${v.image || 'https://via.placeholder.com/100?text=Vin'}" class="img-vin" onclick="zoom('${v.image}')">
                            <div class="vin-info">
                                <b>${v.nom}</b>
                                <span style="color:var(--gold); font-size:1.4rem">${st}</span>
                            </div>
                            <div class="vin-qte">x${v.qte}</div>
                            <button style="position:absolute; top:10px; right:10px; background:none; border:none; color:#ff4444; font-size:1.5rem;" onclick="supprimer('${id}')">✕</button>
                        </div>`;
                });
            });
        }

        function zoom(src) { if(!src) return; document.getElementById('zoomImg').src = src; document.getElementById('zoomOverlay').style.display = 'flex'; }
        function supprimer(id) { if(confirm("Supprimer cette bouteille ?")) db.ref('users/' + userUID + '/cave/' + id).remove(); }
        function goToAdd() { document.getElementById('nomVin').value=""; document.getElementById('imgVin').value=""; document.getElementById('noteVin').value=""; setStars(0); showPage('PAGE_ADD'); }

        function sauvegarderVin() {
            const n = document.getElementById('nomVin').value;
            if(!n) return;
            db.ref('users/' + userUID + '/cave').push({
                nom: n, qte: document.getElementById('qteVin').value || 1,
                image: document.getElementById('imgVin').value || "",
                noteEtoiles: noteEtoiles, note: document.getElementById('noteVin').value,
                categorie: rayonActuel
            }).then(() => showPage('PAGE_LISTE'));
        }
    </script>
</body>
</html>
