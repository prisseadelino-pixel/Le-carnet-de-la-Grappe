<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@300;600&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.1); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        .logo { width: 100px; margin: 20px auto; border: 1px solid var(--gold); padding: 10px; border-radius: 5px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 1.5rem; text-transform: uppercase; margin: 10px 0; }
        input { width: 90%; max-width: 300px; padding: 12px; margin: 8px 0; background: #111; color: #fff; border: 1px solid var(--brd); border-radius: 5px; }
        .btn-gold { background: var(--gold); border: none; color: #000; padding: 15px; width: 90%; max-width: 300px; margin: 10px 0; text-transform: uppercase; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .btn-google { background: white; color: #000; border: none; padding: 12px; width: 90%; max-width: 300px; border-radius: 5px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn-outline { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 12px; width: 90%; max-width: 300px; margin-top: 10px; cursor: pointer; border-radius: 5px; }
        .card { background: #0a0a0a; border: 1px solid var(--brd); padding: 15px; display: flex; width: 100%; max-width: 500px; text-align: left; margin-bottom: 10px; border-radius: 8px; align-items: center; }
        .img-vin { width: 60px; height: 80px; object-fit: cover; margin-right: 15px; border-radius: 4px; border: 1px solid var(--brd); }
    </style>
</head>
<body>
    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Mon Carnet</h1>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mot de passe">
        <button class="btn-gold" onclick="loginEmail()">Se connecter</button>
        <button class="btn-outline" onclick="registerEmail()">Créer un compte</button>
        <div style="margin: 20px 0; color: #444;">─ OU ─</div>
        <button class="btn-google" onclick="loginGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Continuer avec Google
        </button>
        <p id="error" style="color:red; font-size: 0.8rem; margin-top: 10px;"></p>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        <button class="btn-gold" onclick="openRayon('ROUGES')">Vins Rouges</button>
        <button class="btn-gold" onclick="openRayon('BLANCS')">Vins Blancs</button>
        <button class="btn-gold" onclick="openRayon('ROSES')">Vins Rosés</button>
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">Champagnes</button>
        <button onclick="auth.signOut()" style="color:gray; background:none; border:none; margin-top:30px; cursor:pointer;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle"></h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-gold" onclick="showPage('PAGE_ADD')">Ajouter une bouteille</button>
        <button class="btn-outline" onclick="showPage('PAGE_HOME')">← Retour</button>
    </div>

    <div id="PAGE_ADD" class="p">
        <h1>Ajouter un vin</h1>
        <input type="text" id="nomVin" placeholder="Nom du vin">
        <input type="number" id="qteVin" placeholder="Quantité" value="1">
        <input type="text" id="imgVin" placeholder="Lien de la photo (URL)">
        <button class="btn-gold" onclick="sauvegarderVin()">Enregistrer</button>
        <button class="btn-outline" onclick="showPage('PAGE_LISTE')">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID = null, rayonActuel = "";

        // FONCTIONS DE CONNEXION
        function loginEmail() {
            const e = document.getElementById('email').value, p = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => document.getElementById('error').innerText = "Erreur de connexion");
        }
        function registerEmail() {
            const e = document.getElementById('email').value, p = document.getElementById('password').value;
            auth.createUserWithEmailAndPassword(e, p).catch(err => document.getElementById('error').innerText = "Compte déjà existant ou mot de passe trop court");
        }
        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(() => auth.signInWithRedirect(provider));
        }

        // GESTION DES PAGES
        auth.onAuthStateChanged(u => {
            if(u) { userUID = u.uid; document.getElementById('userName').innerText = "Cave de " + (u.displayName || u.email.split('@')[0]); showPage('PAGE_HOME'); }
            else { showPage('PAGE_AUTH'); }
        });

        function showPage(id) {
            document.querySelectorAll('.p').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openRayon(n) {
            rayonActuel = n; document.getElementById('rayonTitle').innerText = n;
            chargerVins(); showPage('PAGE_LISTE');
        }

        function chargerVins() {
            const c = document.getElementById('container-vins');
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => {
                c.innerHTML = ""; const data = s.val();
                if(!data) { c.innerHTML = "<p style='color:gray'>Aucun vin dans ce rayon.</p>"; return; }
                Object.entries(data).forEach(([id, v]) => {
                    c.innerHTML += `<div class="card"><img src="${v.image || 'https://via.placeholder.com/60'}" class="img-vin"><div><b>${v.nom}</b></div><div style="margin-left:auto">x${v.qte}</div></div>`;
                });
            });
        }

        function sauvegarderVin() {
            const n = document.getElementById('nomVin').value; if(!n) return;
            db.ref('users/' + userUID + '/cave').push({
                nom: n, qte: document.getElementById('qteVin').value,
                image: document.getElementById('imgVin').value, categorie: rayonActuel
            }).then(() => { 
                document.getElementById('nomVin').value = ""; 
                showPage('PAGE_LISTE'); 
            });
        }
    </script>
</body>
</html>
