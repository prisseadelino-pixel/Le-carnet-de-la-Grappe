<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;700&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: #c5a059; } /* Bordure dorée comme sur l'image */
        
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; overflow-x: hidden; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        
        .logo { width: 120px; height: auto; margin-bottom: 15px; border: 1.5px solid var(--gold); padding: 8px; border-radius: 8px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 2.2rem; margin: 25px 0; text-transform: uppercase; letter-spacing: 3px; }
        
        /* BOUTONS STYLE "CAVE DE ADELINO" */
        .btn-gold { 
            background: rgba(0,0,0,0.5); 
            border: 2px solid var(--gold); 
            color: var(--gold); 
            padding: 15px 25px; 
            width: 90%; 
            max-width: 550px; 
            margin: 15px 0; 
            text-transform: uppercase; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 1.1rem; 
            border-radius: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            box-sizing: border-box; 
        }
        
        /* TAILLE DES BOUTEILLES AJUSTÉE SELON TA CAPTURE */
        .btn-gold svg { 
            height: 80px; 
            width: 45px; 
            margin-right: 30px; 
            background: transparent;
        }

        .intro-text { width: 90%; max-width: 450px; margin: 20px 0; padding: 15px; border-left: 2px solid var(--gold); background: rgba(197,160,89,0.05); font-size: 0.95rem; color: #ddd; text-align: left; }
        
        /* ELEMENTS DE LA LISTE */
        .card { background: #0d0d0d; border: 1px solid rgba(255,255,255,0.1); padding: 15px; display: flex; width: 95%; max-width: 600px; text-align: left; margin-bottom: 12px; border-radius: 12px; align-items: center; box-sizing: border-box; }
        .img-vin { width: 70px; height: 100px; object-fit: cover; border: 1px solid var(--gold); border-radius: 5px; margin-right: 15px; }
        .vin-info { flex: 1; }
        .vin-info b { font-size: 1.2rem; color: var(--gold); display: block; }
        .vin-qte { font-size: 1.4rem; font-weight: bold; }
        
        .btn-add { position: fixed; bottom: 30px; right: 20px; background: var(--gold); width: 65px; height: 65px; border-radius: 50%; border: none; font-size: 35px; color: #000; font-weight: bold; z-index: 100; }
        
        input, textarea { width: 95%; max-width: 500px; padding: 15px; margin: 8px 0; background: #111; color: #fff; border: 1px solid #333; border-radius: 10px; font-family: 'Montserrat'; }
    </style>
</head>
<body>

    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Le Carnet de la Grappe</h1>
        <div class="intro-text">Gérez votre cave et vos dégustations en un clin d'oeil.</div>
        <button id="googleLogin" class="btn-gold" style="background:white; color:black; border:none; justify-content:center;">CONNEXION GOOGLE</button>
    </div>

    <div id="PAGE_HOME" class="p">
        <h1 id="userName">Ma Cave</h1>
        
        <button class="btn-gold" onclick="openRayon('ROUGES')">
            <svg viewBox="0 0 100 100">
                <path d="M48 8V18M45 18H55V8C55 6 54 5 52 5C50 5 49 6 48 8V18Z" fill="#310a0a" stroke="#600d0d"/>
                <path d="M38 18C30 21 25 28 25 35V85C25 90 29 93 35 93H65C71 93 75 90 75 85V35C75 28 70 21 62 18H38Z" fill="#7a0d0d" stroke="#600d0d" stroke-width="1.5"/>
                <rect x="32" y="45" width="36" height="25" fill="#310a0a" opacity="0.8"/>
            </svg>
            VINS ROUGES
        </button>

        <button class="btn-gold" onclick="openRayon('BLANCS')">
            <svg viewBox="0 0 100 100">
                <path d="M45 18H55V8C55 6 54 5 52 5C50 5 49 6 48 8V18Z" fill="#555" stroke="#333"/>
                <path d="M38 18C30 21 25 28 25 35V85C25 90 29 93 35 93H65C71 93 75 90 75 85V35C75 28 70 21 62 18H38Z" fill="#fff9e6" stroke="#d4b45d" stroke-width="1.5"/>
                <rect x="32" y="45" width="36" height="25" fill="#d4b45d" opacity="0.3"/>
            </svg>
            VINS BLANCS
        </button>

        <button class="btn-gold" onclick="openRayon('ROSES')">
            <svg viewBox="0 0 100 100">
                <path d="M45 18H55V8C55 6 54 5 52 5C50 5 49 6 48 8V18Z" fill="#444" stroke="#222"/>
                <path d="M38 18C30 21 25 28 25 35V85C25 90 29 93 35 93H65C71 93 75 90 75 85V35C75 28 70 21 62 18H38Z" fill="#ffe3e3" stroke="#ffb3b3" stroke-width="1.5"/>
                <rect x="32" y="45" width="36" height="25" fill="#ffb3b3" opacity="0.4"/>
            </svg>
            VINS ROSÉS
        </button>

        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">
            <svg viewBox="0 0 100 100">
                <path d="M42 5V15H58V5C58 4 57 3 53 3H47C43 3 42 4 42 5V15Z" fill="#c5a059"/>
                <path d="M38 18C30 21 25 28 25 35V85C25 90 29 93 35 93H65C71 93 75 90 75 85V35C75 28 70 21 62 18H38Z" fill="#151515" stroke="#c5a059" stroke-width="2"/>
                <rect x="34" y="50" width="32" height="20" fill="#c5a059" opacity="0.7"/>
            </svg>
            CHAMPAGNES
        </button>

        <button class="btn-gold" style="justify-content:center; font-size:0.8rem; height:40px; margin-top:30px; border-color:#333; color:gray;" onclick="alert('Lien QR Copié !')">🔗 MON QR CODE</button>
        <button onclick="auth.signOut().then(()=>location.reload())" style="color:gray; background:none; border:none; margin-top:20px; text-decoration:underline; cursor:pointer;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle">Rayon</h1>
        <div id="container-vins" style="width:100%"></div>
        <button class="btn-add" onclick="goToAdd()">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); background:none; border:none; margin-top:30px; font-weight:bold;">← RETOUR</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyABRweq9NpgFHy9tWpN8UhD0nBdTmZ-7dU",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let userUID = null, rayonActuel = "";

        document.getElementById('googleLogin').onclick = () => {
            const p = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(p);
        };

        auth.onAuthStateChanged(u => {
            if(u) { userUID = u.uid; document.getElementById('userName').innerText = "Cave de " + u.displayName.toUpperCase(); showPage('PAGE_HOME'); } 
            else { showPage('PAGE_AUTH'); }
        });

        function showPage(id) { document.querySelectorAll('.p').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function openRayon(n) { rayonActuel = n; document.getElementById('rayonTitle').innerText = n; chargerVins(); showPage('PAGE_LISTE'); }

        function chargerVins() {
            const c = document.getElementById('container-vins');
            db.ref('users/' + userUID + '/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', s => {
                c.innerHTML = "";
                if(!s.exists()) { c.innerHTML = "<p style='color:gray;'>Aucun vin ici.</p>"; return; }
                s.forEach(child => {
                    const v = child.val();
                    c.innerHTML += `
                        <div class="card">
                            <img src="${v.image || 'https://via.placeholder.com/150'}" class="img-vin">
                            <div class="vin-info"><b>${v.nom}</b></div>
                            <div class="vin-qte">x${v.qte}</div>
                        </div>`;
                });
            });
        }
        function goToAdd() { alert("Ajout disponible dans la version complète"); }
    </script>
</body>
</html>
