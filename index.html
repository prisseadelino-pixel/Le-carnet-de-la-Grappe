<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE CARNET DE LA GRAPPE</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@300;600&display=swap');
        :root { --gold: #c5a059; --bg: #000; --brd: rgba(255,255,255,0.1); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; text-align: center; }
        .p { display: none; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; box-sizing: border-box; }
        .active { display: flex !important; }
        .logo { width: 120px; margin: 15px auto; border: 1px solid var(--gold); padding: 5px; border-radius: 5px; }
        h1 { font-family: 'Bodoni Moda', serif; color: var(--gold); font-size: 1.4rem; text-transform: uppercase; }
        .btn-gold { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 12px; width: 90%; max-width: 320px; margin: 8px 0; font-weight: bold; cursor: pointer; }
        .btn-google { background: white; color: #000; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .btn-add { position: fixed; bottom: 25px; right: 20px; background: var(--gold); width: 55px; height: 55px; border-radius: 50%; border: none; font-size: 28px; color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* STYLE DES CARTES VINS */
        .card { background: #0f0f0f; border: 1px solid var(--brd); padding: 12px; display: flex; width: 100%; max-width: 450px; text-align: left; margin-bottom: 10px; border-radius: 8px; position: relative; }
        .card img { width: 60px; height: 80px; object-fit: cover; border-radius: 4px; margin-right: 12px; background: #222; }
        .card-info { flex: 1; }
        .stars { color: var(--gold); font-size: 0.9rem; }
        .edit-pen { position: absolute; top: 10px; right: 10px; color: var(--gold); cursor: pointer; font-size: 1.2rem; }

        /* FORMULAIRE */
        input, textarea { width: 95%; padding: 12px; margin: 8px 0; background: #111; color: #fff; border: 1px solid var(--brd); border-radius: 5px; }
        #preview { width: 100px; height: 130px; object-fit: cover; border: 1px solid var(--gold); margin: 10px 0; display: none; }
        .star-rating { font-size: 2rem; color: #333; cursor: pointer; margin: 10px 0; }
        .star-rating .selected { color: var(--gold); }
    </style>
</head>
<body>

    <div id="PAGE_AUTH" class="p active">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" class="logo">
        <h1>Le Carnet de la Grappe</h1>
        <button class="btn-google" onclick="login()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Se connecter avec Google
        </button>
    </div>

    <div id="PAGE_HOME" class="p">
        <img src="https://i.servimg.com/u/f49/11/31/89/70/picsar10.jpg" style="width:60px;">
        <h1 id="userName">Ma Cave</h1>
        <button class="btn-gold" onclick="openRayon('ROUGES')">Vins Rouges</button>
        <button class="btn-gold" onclick="openRayon('BLANCS')">Vins Blancs</button>
        <button class="btn-gold" onclick="openRayon('ROSES')">Vins Rosés</button>
        <button class="btn-gold" onclick="openRayon('CHAMPAGNES')">Champagnes</button>
        <button onclick="logout()" style="color:gray; background:none; border:none; margin-top:30px; text-decoration: underline;">Déconnexion</button>
    </div>

    <div id="PAGE_LISTE" class="p">
        <h1 id="rayonTitle">Rayon</h1>
        <div id="container-vins" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
        <button class="btn-add" onclick="goToAdd()">+</button>
        <button onclick="showPage('PAGE_HOME')" style="color:var(--gold); border:none; background:none; margin-top:20px;">← RETOUR ACCUEIL</button>
    </div>

    <div id="PAGE_ADD" class="p">
        <h1 id="formTitle">Nouveau Vin</h1>
        
        <input type="hidden" id="editId">
        
        <label for="fileInput" class="btn-gold" style="display:block; width:80%">📷 PRENDRE UNE PHOTO</label>
        <input type="file" id="fileInput" accept="image/*" capture="camera" style="display:none" onchange="previewImage(this)">
        <img id="preview">

        <input type="text" id="nomVin" placeholder="Nom du Domaine / Cuvée">
        <input type="number" id="qteVin" placeholder="Quantité" value="1">
        
        <div class="star-rating" id="starContainer">
            <span onclick="setRate(1)">★</span><span onclick="setRate(2)">★</span><span onclick="setRate(3)">★</span><span onclick="setRate(4)">★</span><span onclick="setRate(5)">★</span>
        </div>

        <textarea id="noteVin" placeholder="Notes de dégustation..."></textarea>
        
        <button class="btn-gold" style="background:var(--gold); color:#000;" onclick="sauvegarderVin()">ENREGISTRER</button>
        <button onclick="showPage('PAGE_LISTE')" style="color:gray; background:none; border:none; margin-top:15px;">Annuler</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoxRyIrC3xKKLhTt6nmJTFQ-54kNjCIQ8",
            authDomain: "le-carnet-de-la-grappe.firebaseapp.com",
            databaseURL: "https://le-carnet-de-la-grappe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "le-carnet-de-la-grappe",
            appId: "1:90122533942:web:0448a69951e95108ce6c97"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        
        let userUID = null, rayonActuel = "", currentRate = 0, currentPhoto = "";

        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(() => auth.signInWithRedirect(provider));
        }
        function logout() { auth.signOut().then(() => window.location.reload()); }

        auth.onAuthStateChanged(user => {
            if (user) { userUID = user.uid; document.getElementById('userName').innerText = "Cave de " + user.displayName; showPage('PAGE_HOME'); }
            else { showPage('PAGE_AUTH'); }
        });

        function showPage(id) {
            document.querySelectorAll('.p').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openRayon(nom) {
            rayonActuel = nom;
            document.getElementById('rayonTitle').innerText = nom;
            chargerVins();
            showPage('PAGE_LISTE');
        }

        function setRate(n) {
            currentRate = n;
            const stars = document.querySelectorAll('#starContainer span');
            stars.forEach((s, i) => s.classList.toggle('selected', i < n));
        }

        function previewImage(input) {
            const reader = new FileReader();
            reader.onload = e => {
                currentPhoto = e.target.result;
                const img = document.getElementById('preview');
                img.src = currentPhoto;
                img.style.display = "block";
            };
            reader.readAsDataURL(input.files[0]);
        }

        function chargerVins() {
            const container = document.getElementById('container-vins');
            db.ref('users/'+userUID+'/cave').orderByChild('categorie').equalTo(rayonActuel).on('value', snap => {
                container.innerHTML = "";
                snap.forEach(child => {
                    const v = child.val();
                    const stars = "★".repeat(v.noteStar || 0) + "☆".repeat(5 - (v.noteStar || 0));
                    container.innerHTML += `
                        <div class="card">
                            <img src="${v.photo || 'https://via.placeholder.com/60x80?text=Vin'}">
                            <div class="card-info">
                                <b>${v.nom}</b><br>
                                <span class="stars">${stars}</span><br>
                                <small>Quantité: ${v.qte}</small>
                            </div>
                            <div class="edit-pen" onclick="editVin('${child.key}')">✎</div>
                        </div>`;
                });
            });
        }

        function goToAdd() {
            document.getElementById('formTitle').innerText = "Nouveau Vin";
            document.getElementById('editId').value = "";
            document.getElementById('nomVin').value = "";
            document.getElementById('qteVin').value = "1";
            document.getElementById('noteVin').value = "";
            document.getElementById('preview').style.display = "none";
            currentPhoto = ""; currentRate = 0; setRate(0);
            showPage('PAGE_ADD');
        }

        function editVin(id) {
            db.ref('users/'+userUID+'/cave/'+id).once('value', snap => {
                const v = snap.val();
                document.getElementById('formTitle').innerText = "Modifier";
                document.getElementById('editId').value = id;
                document.getElementById('nomVin').value = v.nom;
                document.getElementById('qteVin').value = v.qte;
                document.getElementById('noteVin').value = v.noteText || "";
                if(v.photo) {
                    const img = document.getElementById('preview');
                    img.src = v.photo; img.style.display = "block";
                    currentPhoto = v.photo;
                }
                setRate(v.noteStar || 0);
                showPage('PAGE_ADD');
            });
        }

        function sauvegarderVin() {
            const id = document.getElementById('editId').value;
            const data = {
                nom: document.getElementById('nomVin').value,
                qte: document.getElementById('qteVin').value,
                noteText: document.getElementById('noteVin').value,
                noteStar: currentRate,
                photo: currentPhoto,
                categorie: rayonActuel
            };
            if(!data.nom) return alert("Nom requis");
            
            const ref = id ? db.ref('users/'+userUID+'/cave/'+id) : db.ref('users/'+userUID+'/cave').push();
            ref.set(data).then(() => showPage('PAGE_LISTE'));
        }
    </script>
</body>
</html>
